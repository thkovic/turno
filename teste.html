<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login PCS7</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

/* AVISOS */
.aviso {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    z-index: 9999;
    display: none;
}

.vermelho { background: red; }
.verde { background: green; }

.box {
    background: #ffffff;
    padding: 40px 45px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    min-width: 360px;
}

h1 { margin-bottom: 15px; font-size: 22px; }

.status {
    margin-bottom: 20px;
    font-weight: bold;
}

.green-text { color: green; }
.red-text { color: red; }

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    background-color: #eaeaea;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}
button:hover { background-color: #d6d6d6; }
</style>
</head>

<body>

<div id="avisoBackup" class="aviso vermelho"></div>
<div id="avisoBackupFeito" class="aviso verde"></div>

<div class="box">
    <h1>🔐 Login</h1>
    <div id="statusPCS7" class="status"></div>

    <input id="matricula" placeholder="Digite sua matrícula" />
    <button id="btnLogin">Entrar</button>
</div>

<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbzUrVm6vDiiUnsOvL6iv_tP2asrZVEg6SkV035CQ6bGTjYg6kbCKZSuTudYp6YVjRlmrw/exec";

const statusPCS7 = document.getElementById("statusPCS7");
const avisoBackup = document.getElementById("avisoBackup");
const avisoBackupFeito = document.getElementById("avisoBackupFeito");
const inputMatricula = document.getElementById("matricula");
const btnLogin = document.getElementById("btnLogin");

/* Piscar aviso */
function piscar(el){
  setInterval(() => {
    el.style.visibility = el.style.visibility === "hidden" ? "visible" : "hidden";
  }, 650);
}

/* ✅ ESTADO PCS7 VINDO DA PLANILHA */
async function carregarEstadoPCS7() {
  const res = await fetch(`${GAS_URL}?acao=getEstadoPCS7`);
  const estado = await res.json();

  avisoBackup.style.display = "none";
  avisoBackupFeito.style.display = "none";

  if (!estado.pcs7_em_uso) {
    statusPCS7.innerHTML = 'PCS7 está <span class="green-text">LIVRE</span>';
  } else {
    statusPCS7.innerHTML =
      'PCS7 em uso por:<br><span class="red-text">' +
      estado.pcs7_nome + " (" + estado.pcs7_em_uso + ")" +
      "</span>";
  }

  if (estado.backup_pendente === "SIM") {
    avisoBackup.style.display = "block";
    avisoBackup.innerHTML =
      "⚠ MUDANÇA FEITA – NECESSITA FAZER BACKUP<br>" +
      "Data: " + estado.backup_data;
    piscar(avisoBackup);
  }

  if (estado.backup_realizado === "SIM") {
    avisoBackupFeito.style.display = "block";
    avisoBackupFeito.innerHTML =
      "✅ BACKUP REALIZADO<br>" +
      "Data: " + estado.backup_data +
      "<br>Responsável: " + estado.backup_responsavel;
  }
}

/* LOGIN */
btnLogin.onclick = () => {
  const mat = inputMatricula.value.trim();
  if (!mat) { alert("Digite a matrícula!"); return; }

  fetch(`${GAS_URL}?acao=validarMatricula&matricula=${encodeURIComponent(mat)}`)
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        localStorage.setItem("usuario_logado", mat);
        localStorage.setItem("usuario_nome", d.nome || "");
        window.location.href = "menu.html";
      } else {
        alert("Matrícula não encontrada.");
      }
    });
};

/* Se já estiver logado */
if (localStorage.getItem("usuario_logado")) {
  window.location.href = "menu.html";
}

/* Inicialização */
carregarEstadoPCS7();
</script>

</body>
</html>
``
