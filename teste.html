<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login PCS7</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

/* AVISOS */
.aviso {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    z-index: 9999;
    display: none;
}

.vermelho { background: red; }
.verde { background: green; }

.box {
    background: #ffffff;
    padding: 40px 45px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    min-width: 360px;
}

h1 {
    margin-bottom: 15px;
    font-size: 22px;
}

.status {
    margin-bottom: 20px;
    font-weight: bold;
}

.green-text { color: green; }
.red-text { color: red; }

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    background-color: #eaeaea;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #d6d6d6;
}
</style>
</head>

<body>

<!-- AVISO BACKUP PENDENTE -->
<div id="avisoBackup" class="aviso vermelho"></div>

<!-- AVISO BACKUP REALIZADO -->
<div id="avisoBackupFeito" class="aviso verde"></div>

<div class="box">
    <h1>🔐 Login</h1>

    <!-- STATUS PCS7 -->
    <div id="statusPCS7" class="status"></div>

    <input
        type="text"
        id="matricula"
        placeholder="Digite sua matrícula"
    />

    <button id="btnLogin">
        Entrar
    </button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const URL_API =
        "https://script.google.com/macros/s/AKfycbzzfvwV3q7PFycspM95VBVWkEDbM2iPLUxR4rCTE4LALVFXoDAN9-ZvEoZmSDLqElYTig/exec";

    const statusPCS7 = document.getElementById("statusPCS7");
    const avisoBackup = document.getElementById("avisoBackup");
    const avisoBackupFeito = document.getElementById("avisoBackupFeito");
    const inputMatricula = document.getElementById("matricula");
    const btnLogin = document.getElementById("btnLogin");

    /* === FUNÇÃO PARA PISCAR AVISO === */
    function piscar(elemento) {
        setInterval(() => {
            elemento.style.visibility =
                elemento.style.visibility === "hidden" ? "visible" : "hidden";
        }, 650);
    }

    /* === STATUS PCS7 === */
    const pcs7EmUso = localStorage.getItem("pcs7_em_uso");
    const pcs7Nome = localStorage.getItem("pcs7_nome");

    if (!pcs7EmUso) {
        statusPCS7.innerHTML =
            'PCS7 está <span class="green-text">LIVRE</span>';
    } else {
        statusPCS7.innerHTML =
            'PCS7 em uso por:<br><span class="red-text">' +
            (pcs7Nome ? pcs7Nome : '') +
            ' (' + pcs7EmUso + ')</span>';
    }

    /* === AVISO BACKUP PENDENTE === */
    if (localStorage.getItem("backup_pendente") === "true") {
        avisoBackup.style.display = "block";
        avisoBackup.innerHTML =
            "⚠ MUDANÇA FEITA – NECESSITA FAZER BACKUP<br>" +
            "Data da alteração: " +
            localStorage.getItem("backup_data_alteracao");
        piscar(avisoBackup);
    }

    /* === AVISO BACKUP REALIZADO === */
    if (localStorage.getItem("backup_realizado") === "true") {
        avisoBackupFeito.style.display = "block";
        avisoBackupFeito.innerHTML =
            "✅ BACKUP REALIZADO<br>" +
            "Data: " + localStorage.getItem("backup_data") + "<br>" +
            "Responsável: " + localStorage.getItem("backup_responsavel");
    }

    /* === SE JÁ ESTIVER LOGADO, REDIRECIONA === */
    if (localStorage.getItem("usuario_logado")) {
        window.location.href = "menu.html";
        return;
    }

    /* === LOGIN COM PLANILHA === */
    btnLogin.addEventListener("click", () => {
        const matricula = inputMatricula.value.trim();

        if (!matricula) {
            alert("Digite a matrícula!");
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerText = "Validando...";

        fetch(`${URL_API}?acao=validarMatricula&matricula=${encodeURIComponent(matricula)}`)
            .then(res => res.json())
            .then(dados => {
                if (dados.success) {
                    localStorage.setItem("usuario_logado", matricula);
                    localStorage.setItem("usuario_nome", dados.nome || "");
                    window.location.href = "menu.html";
                } else {
                    alert("Matrícula não encontrada.");
                }
            })
            .catch(() => {
                alert("Erro ao validar matrícula.");
            })
            .finally(() => {
                btnLogin.disabled = false;
                btnLogin.innerText = "Entrar";
            });
    });

});
    
sync function carregarEstadoPCS7(){
  const estado = await callGAS({ acao:"getEstadoPCS7" });

  if (estado.backup_pendente === "SIM") {
    mostrarAvisoBackup(estado);
  }

  if (estado.backup_realizado === "SIM") {
    mostrarBackupRealizado(estado);
  }

  if (estado.pcs7_em_uso) {
    console.log("PCS7 em uso por:", estado.pcs7_nome);
  }
}

</script>

</body>
</html>
