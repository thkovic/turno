<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

.box {
    background: #ffffff;
    padding: 35px 45px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    min-width: 340px;
}

h1 {
    margin-bottom: 15px;
    font-size: 22px;
}

.status {
    margin-bottom: 20px;
    font-weight: bold;
}

.green { color: green; }
.red { color: red; }

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    background-color: #eaeaea;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #d6d6d6;
}
</style>
</head>
<body>

<div class="box">
    <h1>🔐 Login</h1>

    <!-- STATUS PCS7 -->
    <div id="statusPCS7" class="status"></div>

    <input
        type="text"
        id="matricula"
        placeholder="Digite sua matrícula"
    />

    <button id="btnLogin">
        Entrar
    </button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const URL_API = "https://script.google.com/macros/s/AKfycbzzfvwV3q7PFycspM95VBVWkEDbM2iPLUxR4rCTE4LALVFXoDAN9-ZvEoZmSDLqElYTig/exec";

    const statusPCS7 = document.getElementById("statusPCS7");
    const inputMatricula = document.getElementById("matricula");
    const btnLogin = document.getElementById("btnLogin");

    // === STATUS PCS7 NO LOGIN ===
    const pcs7EmUso = localStorage.getItem("pcs7_em_uso");
    const pcs7Nome = localStorage.getItem("pcs7_nome");

    if (!pcs7EmUso) {
        statusPCS7.innerHTML = 'PCS7 está <span class="green">LIVRE</span>';
    } else {
        statusPCS7.innerHTML =
            'PCS7 em uso por:<br><span class="red">' +
            (pcs7Nome ? pcs7Nome : '') +
            ' (' + pcs7EmUso + ')</span>';
    }

    // Se já estiver logado, pula login
    if (localStorage.getItem("usuario_logado")) {
        window.location.href = "menu.html";
        return;
    }

    // === LOGIN ===
    btnLogin.addEventListener("click", () => {
        const matricula = inputMatricula.value.trim();

        if (!matricula) {
            alert("Digite a matrícula!");
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerText = "Validando...";

        fetch(`${URL_API}?acao=validarMatricula&matricula=${encodeURIComponent(matricula)}`)
            .then(res => res.json())
            .then(dados => {
                if (dados.success) {
                    localStorage.setItem("usuario_logado", matricula);
                    localStorage.setItem("usuario_nome", dados.nome || "");
                    window.location.href = "menu.html";
                } else {
                    alert("Matrícula não encontrada.");
                }
            })
            .catch(() => {
                alert("Erro ao validar matrícula.");
            })
            .finally(() => {
                btnLogin.disabled = false;
                btnLogin.innerText = "Entrar";
            });
    });

});
</script>

</body>
</html>
