<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login PCS7</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

.box {
    background: #ffffff;
    padding: 40px 45px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    min-width: 360px;
}

h1 {
    margin-bottom: 15px;
    font-size: 22px;
}

.status {
    margin-bottom: 15px;
    font-weight: bold;
}

.green { color: green; }
.red { color: red; }

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    background-color: #eaeaea;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

button:disabled {
    background: #eee;
    cursor: not-allowed;
}

button:hover:not(:disabled) {
    background-color: #d6d6d6;
}
</style>
</head>

<body>

<div class="box">
    <h1>🔐 Login</h1>

    <!-- Status PCS7 -->
    <div id="statusPCS7" class="status"></div>

    <input id="matricula" placeholder="Digite sua matrícula" />
    <button id="btnLogin">Entrar</button>
</div>

<script>
/* ========= CONFIG ========= */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxsaVBnO2wO1k0xQA35r5_k7XO-INUij8HqAqZvNk_XtgqN7OXjDQ4efxMXx_yH-lEaZg/exec";
/* ========================== */

const statusPCS7 = document.getElementById("statusPCS7");
const inputMatricula = document.getElementById("matricula");
const btnLogin = document.getElementById("btnLogin");

/* ========= JSONP ========= */
function chamarGAS(acao, params = {}, depois) {
    const cb = "cb_" + Math.random().toString(36).slice(2);

    window[cb] = function (resp) {
        delete window[cb];
        if (depois) depois(resp);
    };

    let qs = "acao=" + encodeURIComponent(acao) + "&callback=" + cb;
    Object.keys(params).forEach(k => {
        qs += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    });

    const s = document.createElement("script");
    s.src = GAS_URL + "?" + qs;
    document.body.appendChild(s);
}

/* ========= ESTADO PCS7 ========= */
function carregarEstadoPCS7() {
    chamarGAS("getEstadoPCS7", {}, (estado) => {
        const emUso = String(estado.pcs7_em_uso || "").trim();

        if (!emUso) {
            statusPCS7.innerHTML =
                'PCS7 está <span class="green">LIVRE</span>';
            btnLogin.disabled = false;
        } else {
            statusPCS7.innerHTML =
                'PCS7 em uso por <span class="red">' +
                estado.pcs7_nome + " (" + emUso + ")" +
                '</span>';
            btnLogin.disabled = true;
        }
    });
}

/* ========= LOGIN ========= */
btnLogin.onclick = () => {
    const matricula = inputMatricula.value.trim();

    if (!matricula) {
        alert("Digite a matrícula!");
        return;
    }

    chamarGAS(
        "validarMatricula",
        { matricula },
        (dados) => {
            if (dados.success) {
                localStorage.setItem("usuario_logado", matricula);
                localStorage.setItem("usuario_nome", dados.nome || "");
                window.location.href = "menu.html";
            } else {
                alert(dados.message || "Matrícula não encontrada");
            }
        }
    );
};

/* Já logado */
if (localStorage.getItem("usuario_logado")) {
    window.location.href = "menu.html";
}

/* Init */
carregarEstadoPCS7();
</script>

</body>
</html>
