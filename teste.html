<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login PCS7</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

/* AVISOS */
.aviso {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    z-index: 9999;
    display: none;
}

.vermelho { background: red; }
.verde { background: green; }

.box {
    background: #ffffff;
    padding: 40px 45px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    min-width: 360px;
}

h1 { margin-bottom: 15px; font-size: 22px; }

.status {
    margin-bottom: 20px;
    font-weight: bold;
}

.green-text { color: green; }
.red-text { color: red; }

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    background-color: #eaeaea;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}
button:hover { background-color: #d6d6d6; }
</style>
</head>

<body>

<div id="avisoBackup" class="aviso vermelho"></div>
<div id="avisoBackupFeito" class="aviso verde"></div>

<div class="box">
    <h1>🔐 Login</h1>
    <div id="statusPCS7" class="status"></div>

    <input id="matricula" placeholder="Digite sua matrícula" />
    <button id="btnLogin">Entrar</button>
</div>

<script>
/* ========= CONFIG ========= */
const GAS_URL =
"https://script.google.com/macros/s/AKfycbxsaVBnO2wO1k0xQA35r5_k7XO-INUij8HqAqZvNk_XtgqN7OXjDQ4efxMXx_yH-lEaZg/exec";
/* ========================== */

const statusPCS7 = document.getElementById("statusPCS7");
const avisoBackup = document.getElementById("avisoBackup");
const avisoBackupFeito = document.getElementById("avisoBackupFeito");
const inputMatricula = document.getElementById("matricula");
const btnLogin = document.getElementById("btnLogin");

/* Piscar aviso */
function piscar(el){
  setInterval(() => {
    el.style.visibility =
      el.style.visibility === "hidden" ? "visible" : "hidden";
  }, 650);
}

/* ===== JSONP CORE ===== */
function chamarGAS(acao, params = {}, depois) {
  const cb = "cb_" + Math.random().toString(36).slice(2);

  window[cb] = function (resp) {
    delete window[cb];
    if (depois) depois(resp);
  };

  let qs = "acao=" + encodeURIComponent(acao) + "&callback=" + cb;
  Object.keys(params).forEach(k => {
    qs += "&" + encodeURIComponent(k) + "=" +
          encodeURIComponent(params[k]);
  });

  const s = document.createElement("script");
  s.src = GAS_URL + "?" + qs;
  document.body.appendChild(s);
}

/* ===== ESTADO PCS7 (SEM FETCH) ===== */
function carregarEstadoPCS7() {
  chamarGAS("getEstadoPCS7", {}, (estado) => {

    avisoBackup.style.display = "none";
    avisoBackupFeito.style.display = "none";

    if (!estado.pcs7_em_uso) {
      statusPCS7.innerHTML =
        'PCS7 está <span class="green-text">LIVRE</span>';
    } else {
      statusPCS7.innerHTML =
        'PCS7 em uso por:<br><span class="red-text">' +
        estado.pcs7_nome + " (" + estado.pcs7_em_uso + ")" +
        '</span>';
    }

    if (estado.backup_pendente === "SIM") {
      avisoBackup.style.display = "block";
      avisoBackup.innerHTML =
        "⚠ MUDANÇA FEITA – NECESSITA FAZER BACKUP<br>" +
        "Data: " + (estado.backup_data || "");
      piscar(avisoBackup);
    }

    if (estado.backup_realizado === "SIM") {
      avisoBackupFeito.style.display = "block";
      avisoBackupFeito.innerHTML =
        "✅ BACKUP REALIZADO<br>" +
        "Data: " + estado.backup_data +
        "<br>Responsável: " + estado.backup_responsavel;
    }
  });
}

/* ===== LOGIN (SEM FETCH) ===== */
btnLogin.onclick = () => {
  const matricula = inputMatricula.value.trim();

  if (!matricula) {
    alert("Digite a matrícula!");
    return;
  }

  chamarGAS(
    "validarMatricula",
    { matricula },
    (dados) => {
      if (dados.success) {
        localStorage.setItem("usuario_logado", matricula);
        localStorage.setItem("usuario_nome", dados.nome || "");
        window.location.href = "menu.html";
      } else {
        alert(dados.message || "Matrícula não encontrada");
      }
    }
  );
};

/* Já logado */
if (localStorage.getItem("usuario_logado")) {
  window.location.href = "menu.html";
}

/* Init */
carregarEstadoPCS7();
</script>

</body>
</html>
