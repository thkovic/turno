<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
body {

    background-color: #f5f5f5;
}
.top-user {
    position: fixed;
    top: 12px;
    left: 12px;
    background: #ffffff;
    padding: 10px 14px;
    border-radius: 6px;
    font-weight: bold;

}
.aviso {
    position: fixed;

    left: 0;

    padding: 16px;

.vermelho{background:red}

.box{
    background:#fff;

    border-radius:8px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    min-width:320px
}
.btn{
    width:100%;
    padding:14px;
    margin:10px 0;
    font-size:16px;
    font-weight:bold;
    background:#eaeaea;
    border-radius:6px;
    border:none;
    cursor:pointer
}
.btn:hover{background:#d6d6d6}
.btn-danger{background:#ffdddd}
.status{font-weight:bold;margin:12px 0}
.green{color:green}
.red{color:red}
</style>
</head>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzzfvwV3q7PFycspM95VBVWkEDbM2iPLUxR4rCTE4LALVFXoDAN9-ZvEoZmSDLqElYTig/exec"";

function chamarGAS(acao, params = {}, depois) {
  const cb = "cb_" + Math.random().toString(36).slice(2);

  window[cb] = function(resp){
    delete window[cb];
    if (depois) depois(resp);
  };

  let qs = `acao=${acao}&callback=${cb}`;
  Object.keys(params).forEach(k=>{
    qs += `&${k}=${encodeURIComponent(params[k])}`;
  });

  const s = document.createElement("script");
  s.src = `${GAS_URL}?${qs}`;
  document.body.appendChild(s);
}

btnAcessar.onclick = () => {
  chamarGAS("setEstadoPCS7", {

};
</script>
