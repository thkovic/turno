<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzzfvwV3q7PFycspM95VBVWkEDbM2iPLUxR4rCTE4LALVFXoDAN9-ZvEoZmSDLqElYTig/exec";

function chamarGAS(acao, params = {}, depois) {
  const cb = "cb_" + Math.random().toString(36).slice(2);

  window[cb] = function(resp){
    delete window[cb];
    if (depois) depois(resp);
  };

  let qs = `acao=${acao}&callback=${cb}`;
  Object.keys(params).forEach(k=>{
    qs += `&${k}=${encodeURIComponent(params[k])}`;
  });

  const s = document.createElement("script");
  s.src = `${GAS_URL}?${qs}`;
  document.body.appendChild(s);
}

btnAcessar.onclick = () => {
  chamarGAS("setEstadoPCS7", {
    matricula: localStorage.getItem("usuario_logado"),
    nome: localStorage.getItem("usuario_nome")
  }, carregarEstadoPCS7);
};
</script>
