<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Menu Principal</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

.top-user {
    position: fixed;
    top: 12px;
    left: 12px;
    background: #ffffff;
    padding: 10px 14px;
    border-radius: 6px;
    font-weight: bold;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

.aviso {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    z-index: 9999;
    display: none;
}
.vermelho { background: red; }
.verde { background: green; }

.container {
    display: flex;
    gap: 40px;
}

.box {
    background: #ffffff;
    padding: 35px 45px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    min-width: 320px;
}

.btn {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: bold;
    background-color: #eaeaea;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}
.btn:hover { background-color: #d6d6d6; }
.btn-danger { background-color: #ffdddd; }

.status { font-weight: bold; margin: 12px 0; }
.green { color: green; }
.red { color: red; }
</style>
</head>

<body>

<div id="avisoBackup" class="aviso vermelho"></div>
<div id="avisoBackupFeito" class="aviso verde"></div>

<div class="top-user">
    Usuário: <span id="usuarioTopo"></span>
</div>

<div class="container">

<div class="box">
    <h2>🏠 Principal</h2>

    <buttontml
        📝 Registro de Histórico - TURNO
    </button>

    <button class="btn" onclick="alert('MOC em desenvolvimento')">
        🧩 MOC
    </button>

    <button class="btn btn-danger" onclick="logout()">
        🔒 Logout
    </button>
</div>

<div class="box">
    <h2>📁 Projeto</h2>

    <div id="statusPCS7" class="status"></div>

    <button class="btn" id="btnAcessar">⚙️ Acessar PCS7</button>
    <button class="btn btn-danger" id="btnEncerrar" style="display:none">🔒 Encerrar PCS7</button>
    <button class="btn" id="btnBackup" style="display:none">💾 REALIZAR BACKUP</button>
</div>
</div>

<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbzzfvwV3q7PFycspM95VBVWkEDbM2iPLUxR4rCTE4LALVFXoDAN9-ZvEoZmSDLqElYTig/exec";

const matricula = localStorage.getItem("usuario_logado");
const nome = localStorage.getItem("usuario_nome") || "";

if (!matricula) location.href = "teste.html";

document.getElementById("usuarioTopo").innerText = `${nome} (${matricula})`;

const status = document.getElementById("statusPCS7");
const btnAcessar = document.getElementById("btnAcessar");
const btnEncerrar = document.getElementById("btnEncerrar");
const btnBackup = document.getElementById("btnBackup");
const aviso = document.getElementById("avisoBackup");
const avisoFeito = document.getElementById("avisoBackupFeito");

/* JSONP helper */
function chamarGAS(url, reload = true) {
    const s = document.createElement("script");
    s.src = url;
    document.body.appendChild(s);
    if (reload) setTimeout(carregarEstadoPCS7, 600);
}

function piscar(el){
  setInterval(() => {
    el.style.visibility = el.style.visibility === "hidden" ? "visible" : "hidden";
  }, 600);
}

async function carregarEstadoPCS7(){
  const r = await fetch(`${GAS_URL}?acao=getEstadoPCS7`);
  const e = await r.json();

  aviso.style.display = "none";
  avisoFeito.style.display = "none";
  btnBackup.style.display = "none";

  if (!e.pcs7_em_uso) {
    status.innerHTML = 'PCS7 está <span class="green">LIVRE</span>';
    btnAcessar.style.display = "block";
    btnEncerrar.style.display = "none";
  } else if (e.pcs7_em_uso === matricula) {
    status.innerText = "Você está acessando o PCS7";
    btnAcessar.style.display = "none";
    btnEncerrar.style.display = "block";
  } else {
    status.innerHTML =
      `PCS7 em uso por <span class="red">${e.pcs7_nome}</span>`;
    btnAcessar.style.display = "none";
    btnEncerrar.style.display = "none";
  }

  if (e.backup_pendente === "SIM") {
    aviso.style.display = "block";
    aviso.innerHTML = "⚠ BACKUP PENDENTE";
    piscar(aviso);
    btnBackup.style.display = "block";
  }

  if (e.backup_realizado === "SIM") {
    avisoFeito.style.display = "block";
    avisoFeito.innerHTML =
      "✅ BACKUP REALIZADO<br>Responsável: " + e.backup_responsavel;
  }
}

/* BOTÕES */
btnAcessar.onclick = () => {
  chamarGAS(
    `${GAS_URL}?acao=setEstadoPCS7&matricula=${encodeURIComponent(matricula)}&nome=${encodeURIComponent(nome)}&callback=cb1`
  );
};

btnEncerrar.onclick = () => {
  if (confirm("Foi feita alguma alteração?")) {
    chamarGAS(`${GAS_URL}?acao=setBackupPendente&callback=cb2`);
  } else {
    chamarGAS(`${GAS_URL}?acao=setEstadoPCS7&matricula=&nome=&callback=cb3`);
  }
};

btnBackup.onclick = () => {
  if (confirm("Você realizou o backup?")) {
    chamarGAS(
      `${GAS_URL}?acao=setBackupRealizado&nome=${encodeURIComponent(nome)}&callback=cb4`
    );
  }
};

function logout(){
  localStorage.clear();
  location.href = "teste.html";
}

/* INIT */
carregarEstadoPCS7();
</script>

</body>
</html>
