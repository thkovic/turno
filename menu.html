<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Histórico</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
}

.top-user {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #f3f3f3;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
}
</style>
</head>

<body>

<script>
/* 🔐 PROTEÇÃO GLOBAL
   Login ocorre SOMENTE no teste.html */
const MATRICULA_ATUAL = localStorage.getItem("usuario_logado");
const NOME_ATUAL = localStorage.getItem("usuario_nome");

if (!MATRICULA_ATUAL) {
    window.location.href = "teste.html";
}
</script>

<!-- Usuário logado (apenas identificação) -->
<div class="top-user">
    Usuário: <span id="usuarioTopo"></span>
</div>

<script>
document.getElementById("usuarioTopo").innerText =
    NOME_ATUAL ? `${NOME_ATUAL} (${MATRICULA_ATUAL})` : MATRICULA_ATUAL;
</script>

<h1>📝 Sistema de Histórico</h1>

<p>Watchdog: <span id="watchdog">--</span></p>

<!-- ✅ LOGIN REMOVIDO -->

<h2>Registrar Passagem</h2>

<form id="formRegistro">
    <label>Nome *</label><br>
    <input type="text" id="nome" required><br><br>

    <label>Matrícula *</label><br>
    <input type="text" id="matricula" readonly><br><br>

    <label>Data *</label><br>
    <input type="date" id="data" required><br><br>

    <label>Equipamento *</label><br>
    <input type="text" id="equipamento" required><br><br>

    <label>Acionamento *</label><br>
    <input type="text" id="acionamento" required><br><br>

    <label>Problema *</label><br>
    <textarea id="problema" required></textarea><br><br>

    <label>Solução</label><br>
    <textarea id="solucao"></textarea><br><br>

    <label>Encerramento</label><br>
    <textarea id="encerramento"></textarea><br><br>
