<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Menu Principal</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

.top-user {
    position: fixed;
    top: 12px;
    left: 12px;
    background: #fff;
    padding: 10px 14px;
    border-radius: 6px;
    font-weight: bold;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

.aviso {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    z-index: 9999;
    display: none;
}

.vermelho { background: red; }
.verde { background: green; }

.container {
    display: flex;
    gap: 40px;
}

.box {
    background: #fff;
    padding: 35px 45px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    min-width: 320px;
}

.btn {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: bold;
    background: #eaeaea;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

.btn-danger { background: #ffdddd; }
.btn:hover { background: #d6d6d6; }

.status { font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>

<div id="avisoBackup" class="aviso vermelho"></div>
<div id="avisoBackupFeito" class="aviso verde"></div>

<div class="top-user">
    Usuário: <span id="usuarioTopo"></span>
</div>

<div class="container">

<div class="box">
    <h2>🏠 Principal</h2>

    <button class="btn" onclick="location   </button>

    <button class="btn btn-danger" onclick="logout()">
        🔒 Logout
    </button>
</div>

<div class="box">
    <h2>📁 Projeto</h2>

    <div id="statusPCS7" class="status"></div>

    <button class="btn" id="btnAcessar">
        ⚙️ Acessar PCS7
    </button>

    <button class="btn btn-danger" id="btnEncerrar" style="display:none">
        🔒 Encerrar PCS7
    </button>

    <button class="btn" id="btnBackup" style="display:none">
        💾 REALIZAR BACKUP
    </button>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const matricula = localStorage.getItem("usuario_logado");
    const nome = localStorage.getItem("usuario_nome") || "";
    if (!matricula) return location.href = "teste.html";

    document.getElementById("usuarioTopo").innerText = `${nome} (${matricula})`;

    const status = document.getElementById("statusPCS7");
    const btnAcessar = document.getElementById("btnAcessar");
    const btnEncerrar = document.getElementById("btnEncerrar");
    const btnBackup = document.getElementById("btnBackup");

    const aviso = document.getElementById("avisoBackup");
    const avisoFeito = document.getElementById("avisoBackupFeito");

    function piscar(el) {
        setInterval(() => {
            el.style.visibility =
            el.style.visibility === "hidden" ? "visible" : "hidden";
        }, 600);
    }

    function atualizarAvisos() {
        if (localStorage.getItem("backup_pendente") === "true") {
            aviso.style.display = "block";
            aviso.innerHTML =
                "⚠ MUDANÇA FEITA – NECESSITA FAZER BACKUP<br>" +
                "Data da alteração: " + localStorage.getItem("backup_data_alteracao");
            piscar(aviso);
            btnBackup.style.display = "block";
        }
        if (localStorage.getItem("backup_realizado") === "true") {
            avisoFeito.style.display = "block";
            avisoFeito.innerHTML =
                "✅ BACKUP REALIZADO<br>" +
                "Data: " + localStorage.getItem("backup_data") + "<br>" +
                "Responsável: " + localStorage.getItem("backup_responsavel");
        }
    }

    function atualizarPCS7() {
        const emUso = localStorage.getItem("pcs7_em_uso");
        if (!emUso) {
            status.innerText = "PCS7 LIVRE";
            btnAcessar.style.display = "block";
            btnEncerrar.style.display = "none";
        } else if (emUso === matricula) {
            status.innerText = "Você está acessando o PCS7";
            btnAcessar.style.display = "none";
            btnEncerrar.style.display = "block";
        } else {
            status.innerText = "PCS7 em uso por " + emUso;
            btnAcessar.style.display = "none";
            btnEncerrar.style.display = "none";
        }
    }

    btnAcessar.onclick = () => {
        localStorage.setItem("pcs7_em_uso", matricula);
        localStorage.setItem("pcs7_nome", nome);
        atualizarPCS7();
    };

    btnEncerrar.onclick = () => {
        const alterou = confirm("Foi feita alguma alteração?");
        if (alterou) {
            localStorage.setItem("backup_pendente", "true");
            localStorage.setItem("backup_data_alteracao", new Date().toLocaleString());
        }
        localStorage.removeItem("pcs7_em_uso");
        localStorage.removeItem("pcs7_nome");
        atualizarPCS7();
        location.reload();
    };

    btnBackup.onclick = () => {
        if (confirm("Você realizou o backup?")) {
            localStorage.removeItem("backup_pendente");
            localStorage.setItem("backup_realizado", "true");
            localStorage.setItem("backup_data", new Date().toLocaleString());
            localStorage.setItem("backup_responsavel", `${nome} (${matricula})`);
            location.reload();
        }
    };

    atualizarPCS7();
    atualizarAvisos();
});

function logout() {
    localStorage.removeItem("usuario_logado");
    localStorage.removeItem("usuario_nome");
    location.href = "teste.html";
}
</script>

</body>
</html>
