<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        .box {
            background: #ffffff;
            padding: 35px 45px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            min-width: 320px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            background-color: #eaeaea;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #d6d6d6;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🔐 Login</h1>

    <input
        type="text"
        id="matricula"
        class="input"
        placeholder="Digite sua matrícula"
    />

    <button class="btn" onclick="login()">
        Entrar
    </button>
</div>

<script>
    // Se já estiver logado, pula o login
    if (localStorage.getItem("usuario_logado")) {
        window.location.href = "menu.html";
    }

    function login() {
        const matricula = document.getElementById("matricula").value.trim();

        if (!matricula) {
            alert("Digite a matrícula!");
            return;
        }

        localStorage.setItem("usuario_logado", matricula);
        window.location.href = "menu.html";
    }
</script>

</body>
</html>
