<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Projeto</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        .box {
            background: #ffffff;
            padding: 35px 45px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            min-width: 340px;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 22px;
        }

        .status {
            margin: 20px 0;
            font-weight: bold;
            color: red;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            background-color: #eaeaea;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #d6d6d6;
        }

        .btn-danger {
            background-color: #ffdddd;
        }
    </style>
</head>
<body>

<script>
    // 🔐 PROTEÇÃO DE LOGIN (obrigatória)
    const usuarioLogado = localStorage.getItem("usuario_logado");

    if (!usuarioLogado) {
        window.location.href = "teste.html";
    }
</script>

<div class="box">

    <h1>📁 Projeto</h1>

    <button class="btn" disabled>
        ⚙️ PCS7 EM USO
    </button>

    <div class="status">
        Usuário acessando projeto:<br>
        <span id="usuario"></span>
    </div>

    <button class="btn" onclick="voltarMenu()">
        ⬅️ Voltar ao menu
    </button>

    <button class="btn btn-danger" onclick="logout()">
        🔒 Encerrar acesso
    </button>

</div>

<script>
    // Exibe usuário logado
    document.getElementById("usuario").innerText = usuarioLogado;

    function voltarMenu() {
        window.location.href = "menu.html";
    }

    // Logout global
    function logout() {
        localStorage.removeItem("usuario_logado");
        window.location.href = "teste.html";
    }
</script>

</body>
</html>
