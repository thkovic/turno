<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#2d6a4f">
  <link rel="manifest" href="manifest.json">
  <title>Sistema de Histórico</title>

<style>
body{font-family:Arial;margin:0;padding:0;background:#fff;color:#333}
.container{max-width:1000px;margin:40px auto;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:8px}
h1{text-align:center;color:#2d6a4f;margin-bottom:20px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label{font-weight:600}
input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px}
textarea{min-height:70px}
.full-width{grid-column:1/-1}
button{background:#95d5b2;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer}
button:hover{opacity:.95}

#watchdog{position:fixed;top:10px;right:10px;background:#95d5b2;color:#fff;padding:6px 10px;border-radius:6px;font-weight:bold}

#rankingEquipamentos{
  position:fixed;
  top:50px;
  right:10px;
  background:#f1faee;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  max-width:220px;
}
#rankingEquipamentos ul{list-style:none;padding:0;margin:8px 0 0}
#rankingEquipamentos li{display:flex;justify-content:space-between;margin-bottom:4px;cursor:pointer}

.history table{width:100%;border-collapse:collapse;font-size:13px}
.history th,.history td{border:1px solid #ddd;padding:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history th{background:#e9f5ef;color:#2d6a4f}

.history-card{background:#f7f7f7;padding:14px;margin:12px 0;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
#mobileHistory{display:none}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:#fff;padding:20px;border-radius:10px;max-width:700px;width:95%;max-height:90%;overflow-y:auto}

.paginacao{margin-top:10px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.paginacao button{padding:6px 10px;background:#d8f3dc}
.paginacao button.ativo{background:#2d6a4f;color:#fff}

@media(max-width:800px){
  #rankingEquipamentos{display:none}
  #historyTable{display:none}
  #mobileHistory{display:block}
}
</style>
</head>

<body>
<div id="watchdog">Watchdog: --</div>

<div id="rankingEquipamentos">
  <strong>🏆 Ranking de Equipamentos</strong>
  <ul id="rankingLista"></ul>
</div>

<div class="container">
<h1>📝 Sistema de Histórico</h1>

<div id="loginDiv">
<form id="loginForm">
  <div class="full-width">
    <label>Matrícula</label>
    <input id="loginMatricula" required>
  </div>
  <div class="full-width">
    <button>Entrar</button>
  </div>
</form>
</div>

<div id="registroDiv" style="display:none;">
<form id="turnoForm">
  <input id="nome" placeholder="Nome" required>
  <input id="matricula" readonly required>
  <input type="date" id="data" required>
  <input id="equipamento" required>
  <input type="time" id="acionamento" required>
  <textarea id="problema" required></textarea>
  <textarea id="solucao"></textarea>
  <input type="time" id="encerramento">
  <div class="full-width">
    <button>Registrar</button>
    <button type="button" id="btnLogout" style="background:#ff6b6b">Logout</button>
  </div>
</form>
</div>

<div class="search-bar">
  <input id="searchInput" placeholder="Buscar histórico">
  <button id="btnPDF">📄 PDF</button>
</div>

<div class="history">
<table id="historyTable">
<thead>
<tr><th>ID</th><th>Data</th><th>Executante</th><th>Matrícula</th><th>Equipamento</th><th>Acionamento</th><th>Problema</th><th>Solução</th><th>Encerramento</th></tr>
</thead>
<tbody></tbody>
</table>
<div id="mobileHistory"></div>
</div>
</div>

<div class="modal" id="modalDetalhes">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <div id="modalFields"></div>
    <div id="modalButtons"></div>
  </div>
</div>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec";
const $=i=>document.getElementById(i);
const state={pagina:1,porPagina:10,historico:[],filtrado:[]};
let filtroEquipamento=null;

const esc=s=>s?String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;"}[m])):"";
const fDate=v=>v?new Date(v).toLocaleDateString("pt-BR"):"";
const fTime=v=>v?new Date(v).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";

function callGAS(p){
 const cb="cb"+Math.random().toString(36).slice(2);
 return new Promise((r,j)=>{
  window[cb]=d=>{r(d);delete window[cb]};
  const s=document.createElement("script");
  s.src=GAS_URL+"?"+new URLSearchParams({...p,callback:cb});
  s.onerror=j;
  document.body.appendChild(s);
 });
}

async function carregar(){
 state.historico=(await callGAS({acao:"getHistorico"}))||[];
 render();
}

function render(){
 const termo=($("searchInput").value||"").toLowerCase();
 state.filtrado=state.historico.filter(r=>{
  if(filtroEquipamento && r[4]!==filtroEquipamento) return false;
  return r.some(c=>String(c||"").toLowerCase().includes(termo));
 });

 const t=$("historyTable").querySelector("tbody");
 const m=$("mobileHistory");
 t.innerHTML="";m.innerHTML="";

 state.filtrado.forEach(r=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${r[0]}</td><td>${fDate(r[1])}</td><td>${esc(r[2])}</td><td>${r[3]}</td><td>${esc(r[4])}</td><td>${fTime(r[5])}</td><td>${esc(r[6])}</td><td>${esc(r[7])}</td><td>${fTime(r[8])}</td>`;
  t.appendChild(tr);
 });

 atualizarRanking();
}

function atualizarRanking(){
 const c={};
 state.filtrado.forEach(r=>c[r[4]]=(c[r[4]]||0)+1);
 const ul=$("rankingLista");ul.innerHTML="";
 Object.entries(c).sort((a,b)=>b[1]-a[1]).forEach(([e,q])=>{
  const li=document.createElement("li");
  li.innerHTML=`<span>${esc(e)}</span><span>${q}</span>`;
  li.onclick=()=>{filtroEquipamento=filtroEquipamento===e?null:e;render()};
  ul.appendChild(li);
 });
}

$("searchInput").oninput=render;
$("loginForm").onsubmit=e=>{e.preventDefault();$("loginDiv").style.display="none";$("registroDiv").style.display="block";carregar()};
$("btnLogout").onclick=()=>location.reload();
setInterval(async()=>{$("watchdog").innerText="Watchdog: "+((await callGAS({acao:"getWatchdog"})).watchdog||"--")},3000);

carregar();
</script>
</body>
</html>
