<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sistema de Histórico</title>
<style>
/* Mantive visual e layout originais (compactado para leitura) */
body{font-family:Arial;margin:0;padding:0;background:#fff;color:#333}
.container{max-width:1000px;margin:40px auto;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:8px}
h1{text-align:center;color:#2d6a4f;margin-bottom:20px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label{font-weight:600}
input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
.full-width{grid-column:1/-1}
button{background:#95d5b2;color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer}
button:hover{opacity:.95}
#watchdog{position:fixed;top:10px;right:10px;background:#95d5b2;color:#fff;padding:6px 10px;border-radius:6px;font-weight:bold}
.history table{width:100%;border-collapse:collapse;font-size:13px}
.history th,.history td{border:1px solid #ddd;padding:8px;text-align:left;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history th{background:#e9f5ef;color:#2d6a4f}
#mobileHistory{display:none}
.history-card{background:#f7f7f7;padding:14px;margin:12px 0;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:#fff;padding:20px;border-radius:10px;max-width:600px;width:90%;max-height:90%;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tech-field{margin-bottom:12px}
.search-bar{display:flex;gap:10px;margin-bottom:15px}
.search-bar input{flex:1}
.pdf-btn{background:#2d6a4f;margin-left:10px}
@media(max-width:1200px){
.container{width:95%;margin:10px auto;padding:12px;box-shadow:none}
form{grid-template-columns:1fr}
button{width:100%;padding:14px;font-size:16px}
#historyTable{display:none}
#mobileHistory{display:block}
.search-bar{flex-direction:column}
.pdf-btn{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div id="watchdog">Watchdog: --</div>
<div class="container">
<h1>📝 Sistema de Histórico</h1>

<!-- LOGIN -->
<div id="loginDiv">
<h3>🔐 Login</h3>
<form id="loginForm" class="full-width">
<div class="full-width">
<label>Matrícula</label>
<input id="loginMatricula" required>
</div>
<div class="full-width">
<button>Entrar</button>
</div>
</form>
</div>

<!-- REGISTRO -->
<div id="registroDiv" style="display:none;">
<h3>Registrar Passagem</h3>
<form id="turnoForm">
<div><label>Nome *</label><input id="nome" required></div>
<div><label>Matrícula *</label><input id="matricula" readonly required></div>
<div><label>Data *</label><input type="date" id="data" required></div>
<div><label>Equipamento *</label><input id="equipamento" required></div>
<div><label>Acionamento *</label><input type="time" id="acionamento" required></div>
<div class="full-width"><label>Problema *</label><textarea id="problema" required></textarea></div>
<div class="full-width"><label>Solução *</label><textarea id="solucao" required></textarea></div>
<div><label>Encerramento *</label><input type="time" id="encerramento" required></div>
<div class="full-width">
<button id="btnSubmit">Registrar</button>
<button type="button" id="btnLogout" style="background:#ff6b6b;margin-top:8px;">Logout</button>
</div>
</form>
</div>

<!-- BOTÃO LOG -->
<div id="logDiv" style="display:none;margin-top:15px;">
<button id="btnLog" style="background:#1d3557;">📜 Sistema de Log</button>
</div>

<!-- BUSCA + PDF -->
<div class="search-bar">
<input type="text" id="searchInput" placeholder="Buscar histórico (ID, nome, equipamento)">
<button class="pdf-btn" id="btnPDF">📄 Gerar PDF</button>
</div>

<!-- HISTÓRICO -->
<div class="history">
<h3>📊 Histórico de Registros</h3>
<table id="historyTable">
<thead>
<tr>
<th>ID</th><th>Data</th><th>Executante</th><th>Matrícula</th><th>Equipamento</th><th>Acionamento</th><th>Problema</th><th>Solução</th><th>Encerramento</th>
</tr>
</thead>
<tbody><tr><td colspan="9">Carregando...</td></tr></tbody>
</table>
<div id="mobileHistory"></div>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modalDetalhes">
<div class="modal-content">
<h2>Ficha Técnica</h2>
<div id="modalFields"></div>
<div id="modalButtons" style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
<button onclick="fecharModal()" style="background:#2d6a4f;">Fechar</button>
</div>
</div>
</div>

<script>
/*
  Nova lógica cliente (limpa). Leituras via JSONP. Escritas tentam google.script.run quando disponível
  (quando a página for servida pelo Apps Script); se estiver hospedada no GitHub Pages, POSTs podem falhar sem proxy.
*/

/* ====== Config ====== */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec"; // substitua se necessário

/* ====== Elementos ====== */
const loginForm = document.getElementById('loginForm');
const loginDiv = document.getElementById('loginDiv');
const registroDiv = document.getElementById('registroDiv');
const matriculaInput = document.getElementById('matricula');
const turnoForm = document.getElementById('turnoForm');
const searchInput = document.getElementById('searchInput');
const btnPDF = document.getElementById('btnPDF');
const modalDetalhes = document.getElementById('modalDetalhes');
const modalFields = document.getElementById('modalFields');
const modalButtons = document.getElementById('modalButtons');
const watchdogEl = document.getElementById('watchdog');
const logDiv = document.getElementById('logDiv');
const btnLog = document.getElementById('btnLog');
let fullHistory = [];
let registroSelecionado = null;

/* ====== JSONP helper (GET) ====== */
function jsonpRequest(params, callbackName, onError) {
  const qs = new URLSearchParams(params).toString();
  const src = WEBAPP_URL + "?" + qs + "&callback=" + callbackName;
  const s = document.createElement('script');
  s.src = src;
  s.async = true;
  s.onerror = () => {
    if (onError) onError();
    if (s.parentNode) s.parentNode.removeChild(s);
  };
  s.onload = () => {
    setTimeout(()=>{ if (s.parentNode) s.parentNode.removeChild(s); }, 500);
  };
  document.head.appendChild(s);
}

/* ====== POST helper (tentativa) ====== */
function postJson(action, payload, onSuccess, onError) {
  // Prefer google.script.run quando disponível (quando HTML é servido pelo Apps Script)
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError)[action](payload);
    return;
  }

  // Tenta POST fetch para o WebApp; atenção ao CORS (pode falhar em GitHub Pages)
  fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: action === 'registrar' ? 'registrar' : action, payload })
  })
  .then(r => r.json())
  .then(onSuccess)
  .catch(onError);
}

/* ====== Callbacks JSONP globais ====== */
function handleHistorico(data) {
  fullHistory = Array.isArray(data) ? data : [];
  renderHistory(fullHistory);
}
function handleWatchdog(data) {
  watchdogEl.innerText = data && data.watchdog ? "Watchdog: " + data.watchdog : "Watchdog: --";
}
function handleLog(data) {
  if (!data || !data.length) { alert("Nenhum log registrado."); return; }
  let texto = "📜 LOG DO SISTEMA:\n\n";
  data.forEach(l => texto += `${l[0]} | Matrícula: ${l[1]} | ${l[2]} | ${l[3]}\n`);
  alert(texto);
}
function handleGerarPDF(data) {
  if (data && data.url) window.open(data.url, "_blank");
  else alert("Erro ao gerar PDF: " + (data && data.error ? data.error : "desconhecido"));
}

/* ====== UI: carregar histórico (JSONP) ====== */
function loadHistory(matriculaFiltro = "") {
  jsonpRequest({ action: "historico", matricula: matriculaFiltro }, "handleHistorico", ()=>{ alert("Erro ao carregar histórico (JSONP)."); });
}

/* ====== Render ====== */
function renderHistory(data) {
  const t = document.querySelector("#historyTable tbody");
  const m = document.getElementById("mobileHistory");
  t.innerHTML = ""; m.innerHTML = "";
  if (!data.length) {
    t.innerHTML = '<tr><td colspan="9">Sem registros</td></tr>';
    m.innerHTML = '<p style="text-align:center;color:#888;">Sem registros</p>';
    return;
  }
  const term = searchInput.value.toLowerCase();
  data.filter(r => r.some(c => String(c).toLowerCase().includes(term))).forEach(r => {
    const tr = document.createElement('tr'); tr.onclick = ()=>abrirModal(r);
    r.slice(0,9).forEach(col => { const td = document.createElement('td'); td.textContent = col; tr.appendChild(td); });
    t.appendChild(tr);
    const card = document.createElement('div'); card.className='history-card'; card.onclick = ()=>abrirModal(r);
    card.innerHTML = `<p><strong>ID:</strong> ${r[0]}</p><p><strong>Data:</strong> ${r[1]}</p><p><strong>Executante:</strong> ${r[2]}</p><p><strong>Equipamento:</strong> ${r[4]}</p>`;
    m.appendChild(card);
  });
}

/* ====== Modal / editar / deletar ====== */
function abrirModal(r) {
  registroSelecionado = r;
  modalFields.innerHTML = `
<div class="tech-field"><strong>ID:</strong> ${r[0]}</div>
<div class="tech-field"><strong>Data:</strong> ${r[1]}</div>
<div class="tech-field"><strong>Executante:</strong> ${r[2]}</div>
<div class="tech-field"><strong>Matrícula:</strong> ${r[3]}</div>
<div class="tech-field"><strong>Equipamento:</strong> ${r[4]}</div>
<div class="tech-field"><strong>Acionamento:</strong> ${r[5]}</div>
<div class="tech-field"><strong>Problema:</strong><br>${r[6]}</div>
<div class="tech-field"><strong>Solução:</strong><br>${r[7]}</div>
<div class="tech-field"><strong>Encerramento:</strong> ${r[8]}</div>
  `;
  modalButtons.innerHTML = `<button onclick="fecharModal()" style="background:#2d6a4f;">Fechar</button>`;
  if (matriculaInput.value === String(r[3])) {
    modalButtons.innerHTML += `<button onclick="editarRegistro()" style="background:#4dabf7;">Editar</button><button onclick="deletarRegistro()" style="background:#ff6b6b;">Deletar</button>`;
  }
  modalDetalhes.style.display = 'flex';
}
function fecharModal(){ modalDetalhes.style.display='none'; }

function editarRegistro() {
  if (!registroSelecionado) return;
  document.getElementById('nome').value = registroSelecionado[2];
  matriculaInput.value = registroSelecionado[3];
  document.getElementById('data').value = registroSelecionado[1].split('/').reverse().join('-');
  document.getElementById('equipamento').value = registroSelecionado[4];
  document.getElementById('acionamento').value = registroSelecionado[5];
  document.getElementById('problema').value = registroSelecionado[6];
  document.getElementById('solucao').value = registroSelecionado[7];
  document.getElementById('encerramento').value = registroSelecionado[8];
  fecharModal();
  alert('Edite e clique em Registrar para salvar.');
  // submit handler temporário (volta ao padrão após execução)
  turnoForm.onsubmit = function(e){
    e.preventDefault();
    const p = {
      id: registroSelecionado[0],
      nome: document.getElementById('nome').value,
      matricula: matriculaInput.value,
      data: document.getElementById('data').value,
      equipamento: document.getElementById('equipamento').value,
      acionamento: document.getElementById('acionamento').value,
      problema: document.getElementById('problema').value,
      solucao: document.getElementById('solucao').value,
      encerramento: document.getElementById('encerramento').value
    };
    postJson('editar', p, (res)=>{ if(res.success){ alert('Registro atualizado'); resetSubmitHandler(); loadHistory(matriculaInput.value || ''); fecharModal(); logout(); } else alert('Erro: '+res.message); }, ()=>alert('Erro na requisição de edição'));
  };
}

function deletarRegistro() {
  if (!registroSelecionado) return;
  if (!confirm('Tem certeza que deseja deletar este registro?')) return;
  postJson('deletar', { id: registroSelecionado[0] }, (res)=>{ if(res.success){ alert('Registro deletado'); fecharModal(); loadHistory(matriculaInput.value || ''); logout(); } else alert('Erro: '+res.message); }, ()=>alert('Erro na requisição de exclusão'));
}

/* ====== Nova submissão (criar) ====== */
function resetSubmitHandler(){
  turnoForm.onsubmit = function(e){
    e.preventDefault();
    const p = {
      nome: document.getElementById('nome').value,
      matricula: matriculaInput.value,
      data: document.getElementById('data').value,
      equipamento: document.getElementById('equipamento').value,
      acionamento: document.getElementById('acionamento').value,
      problema: document.getElementById('problema').value,
      solucao: document.getElementById('solucao').value,
      encerramento: document.getElementById('encerramento').value
    };
    postJson('registrar', p, (res)=>{ if(res.success){ alert('Registro salvo'); turnoForm.reset(); loadHistory(matriculaInput.value || ''); logout(); } else alert('Erro: '+res.message); }, ()=>alert('Erro ao salvar registro'));
  };
}

/* ====== Login / Logout ====== */
loginForm.onsubmit = function(e){
  e.preventDefault();
  const mat = document.getElementById('loginMatricula').value;
  loginDiv.style.display='none'; registroDiv.style.display='block';
  matriculaInput.value = mat;
  loadHistory(mat);
  if (mat === '991631240') { logDiv.style.display='block'; postJson('registrarLog', { matricula: mat, acao: 'Login' }, ()=>{}, ()=>{}); }
  else { logDiv.style.display='none'; postJson('registrarLog', { matricula: mat, acao: 'Login' }, ()=>{}, ()=>{}); }
};

function logout(){
  postJson('registrarLog', { matricula: matriculaInput.value, acao: 'Logout' }, ()=>{}, ()=>{});
  registroDiv.style.display='none'; loginDiv.style.display='block'; turnoForm.reset(); matriculaInput.value=''; loadHistory(); logDiv.style.display='none';
}
document.getElementById('btnLogout').onclick = logout;

/* ====== Submit handler padrão ====== */
resetSubmitHandler();

/* ====== Watchdog / PDF / Log (JSONP) ====== */
function atualizarWatchdog(){ jsonpRequest({ action: 'watchdog' }, 'handleWatchdog', ()=>{ watchdogEl.innerText='Watchdog: OFFLINE'; }); }
setInterval(atualizarWatchdog, 3000); atualizarWatchdog();

btnPDF.onclick = ()=> jsonpRequest({ action: 'gerarPDF' }, 'handleGerarPDF', ()=>alert('Erro ao gerar PDF'));
btnLog.onclick = ()=> jsonpRequest({ action: 'log' }, 'handleLog', ()=>alert('Erro ao carregar logs'));

/* ====== Busca ====== */
searchInput.oninput = ()=> renderHistory(fullHistory);

/* ====== Inicial ====== */
loadHistory();

</script>
</body>
</html>
