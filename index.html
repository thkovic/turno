<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sistema de Histórico</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="watchdog">Watchdog: --</div>
  <div class="container">
    <h1>📝 Sistema de Histórico</h1>

    <!-- Login -->
    <div id="loginDiv">
      <h3>🔐 Login</h3>
      <form id="loginForm" class="full-width">
        <div class="full-width">
          <label>Matrícula</label>
          <input id="loginMatricula" required>
        </div>
        <div class="full-width">
          <button>Entrar</button>
        </div>
      </form>
    </div>

    <!-- Registro -->
    <div id="registroDiv" style="display:none;">
      <!-- Seu formulário de registro aqui -->
    </div>

    <!-- Histórico, Log, PDF, Modal -->
    <!-- (conteúdo das partes 2 e 3 que você já montou) -->
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec"; // coloque aqui a URL do seu Web App

    // GET exemplo
    async function loadHistory(matriculaFiltro = null) {
      const url = GAS_URL + "?action=getHistorico" + (matriculaFiltro ? "&matricula=" + matriculaFiltro : "");
      const res = await fetch(url);
      const data = await res.json();
      renderHistory(data);
    }

    // POST exemplo
    async function registrarTurno(payload) {
      const res = await fetch(GAS_URL + "?action=registrarTurno", {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "application/json" }
      });
      const r = await res.json();
      if (r.success) {
        alert("Registro salvo!");
        loadHistory(payload.matricula);
      } else {
        alert("Erro: " + r.message);
      }
    }

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('SW registrado!'))
        .catch(err => console.error('Erro SW:', err));
    }
  </script>
</body>
</html>
