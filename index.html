<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="manifest" href="manifest.json">
  
<meta name="theme-color" content="#2d6a4f">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sistema de Histórico</title>
<style>
/* estilos resumidos para clareza */
body{font-family:Arial;margin:0;padding:0;background:#fff;color:#333}
.container{max-width:1000px;margin:40px auto;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:8px}
h1{text-align:center;color:#2d6a4f;margin-bottom:20px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label{font-weight:600}
input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
.full-width{grid-column:1/-1}
button{background:#95d5b2;color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer}
button:hover{opacity:.95}
#watchdog{position:fixed;top:10px;right:10px;background:#95d5b2;color:#fff;padding:6px 10px;border-radius:6px;font-weight:bold}
.history table{width:100%;border-collapse:collapse;font-size:13px}
.history th,.history td{border:1px solid #ddd;padding:8px;text-align:left;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history th{background:#e9f5ef;color:#2d6a4f}
#mobileHistory{display:none}
.history-card{background:#f7f7f7;padding:14px;margin:12px 0;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:#fff;padding:20px;border-radius:10px;max-width:700px;width:95%;max-height:90%;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tech-field{margin-bottom:12px}
.search-bar{display:flex;gap:10px;margin-bottom:15px}
.search-bar input{flex:1}
.pdf-btn{background:#2d6a4f;margin-left:10px}
@media(max-width:800px){
  .container{width:95%;margin:10px auto;padding:12px;box-shadow:none}
  form{grid-template-columns:1fr}
  button{width:100%;padding:14px;font-size:16px}
  #historyTable{display:none}
  #mobileHistory{display:block}
  .search-bar{flex-direction:column}
  .pdf-btn{margin-left:0;width:100%}
}
  .paginacao{
  margin-top:10px;
  display:flex;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
}
.paginacao button{
  padding:6px 10px;
  border:none;
  border-radius:4px;
  background:#d8f3dc;
  cursor:pointer;
}
.paginacao button.ativo{
  background:#2d6a4f;
  color:#fff;
  font-weight:bold;
}
.paginacao button:disabled{
  opacity:.4;
  cursor:not-allowed;
}
</style>
</head>
<body>
<div id="watchdog">Watchdog: --</div>
<div class="container">
  <h1>📝 Sistema de Histórico</h1>

  <!-- LOGIN -->
  <div id="loginDiv">
    <h3>🔐 Login</h3>
    <form id="loginForm" class="full-width">
      <div class="full-width">
        <label>Matrícula</label>
        <input id="loginMatricula" required>
      </div>
      <div class="full-width">
        <button>Entrar</button>
      </div>
    </form>
  </div>

  <!-- REGISTRO -->
  <div id="registroDiv" style="display:none;">
    <h3>Registrar Passagem</h3>
    <form id="turnoForm">
      <div><label>Nome *</label><input id="nome" required></div>
      <div><label>Matrícula *</label><input id="matricula" readonly required></div>
      <div><label>Data *</label><input type="date" id="data" required></div>
      <div><label>Equipamento *</label><input id="equipamento" required></div>
      <div><label>Acionamento *</label><input type="time" id="acionamento" required></div>
      <div class="full-width"><label>Problema *</label><textarea id="problema" required></textarea></div>
      <div class="full-width"><label>Solução</label><textarea id="solucao"></textarea></div>
      <div><label>Encerramento</label><input type="time" id="encerramento"></div>
      <div class="full-width">
        <button id="btnSubmit">Registrar</button>
        <button type="button" id="btnLogout" style="background:#ff6b6b;margin-top:8px;">Logout</button>
      </div>
    </form>
  </div>

  <div id="logDiv" style="display:none; margin-top:15px;">
    <button id="btnLog" style="background:#1d3557;">📜 Sistema de Log</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar histórico (ID, nome, equipamento, data)">
    <button class="pdf-btn" id="btnPDF">📄 Gerar PDF</button>
    
  </div>

  <div class="history">
    <h3>📊 Histórico de Registros</h3>
    <table id="historyTable">
      <thead>
        <tr>
          <th>ID</th><th>Data</th><th>Executante</th><th>Matrícula</th><th>Equipamento</th><th>Acionamento</th><th>Problema</th><th>Solução</th><th>Encerramento</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="9">Carregando...</td></tr>
      </tbody>
    </table>
    <div id="mobileHistory"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modalDetalhes" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true">
    <h2 id="modalTitle">Ficha Técnica</h2>
    <div id="modalFields"></div>
    <div id="modalButtons" style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;"></div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec";
const $ = id => document.getElementById(id);

const state = {
  pagina: 1,
  porPagina: 10,
  historico: [],
  filtrado: [],
  selecionado: null
};

/* ================= HELPERS ================= */
const esc = s => s == null ? "" : String(s)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");

const fDate = v => v ? new Date(v).toLocaleDateString("pt-BR") : "";
const fTime = v => v ? new Date(v).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "";

function btn(txt, cor, fn){
  const b = document.createElement("button");
  b.textContent = txt;
  b.style.background = cor;
  b.onclick = fn;
  return b;
}

function gas(acao, dados={}){
  return callGAS({acao, ...dados});
}

/* ================= JSONP ================= */
function callGAS(params){
  const cb = "cb_"+Math.random().toString(36).slice(2);
  const url = GAS_URL+"?"+new URLSearchParams({...params,callback:cb});
  return new Promise((res,rej)=>{
    window[cb]=d=>{res(d);delete window[cb]};
    const s=document.createElement("script");
    s.src=url; s.onerror=()=>rej();
    document.body.appendChild(s);
  });
}

/* ================= LOGIN ================= */
$("loginForm").onsubmit = async e=>{
  e.preventDefault();
  const m = $("loginMatricula").value.trim();
  if(!m) return alert("Informe a matrícula");

  $("loginDiv").style.display="none";
  $("registroDiv").style.display="block";
  $("matricula").value=m;

  await carregar(m);
  $("logDiv").style.display = m==="991631240"?"block":"none";
  gas("registrarLog",{matricula:m,acaoTipo:"Login"});
};

$("btnLogout").onclick = async ()=>{
  gas("registrarLog",{matricula:$("matricula").value,acaoTipo:"Logout"});
  $("registroDiv").style.display="none";
  $("loginDiv").style.display="block";
  $("turnoForm").reset();
  $("matricula").value="";
  $("logDiv").style.display="none";
  carregar("");
};

/* ================= HISTÓRICO ================= */
async function carregar(mat=""){
  try{
    const d = await gas("getHistorico",{matricula:mat});
    state.historico = Array.isArray(d)?d.reverse():[];
  }catch{ state.historico=[] }
  render();
}

$("searchInput").oninput = ()=>{state.pagina=1;render()};

function render(){
  const termo = ($("searchInput").value||"").toLowerCase();
  state.filtrado = state.historico.filter(r =>
    r.some((c,i)=>{
      const v = String(c||"").toLowerCase();
      if([1,5,8].includes(i)){
        const d=new Date(c);
        if(!isNaN(d))
          return d.toLocaleString("pt-BR").toLowerCase().includes(termo);
      }
      return v.includes(termo);
    })
  );

  const t=$("historyTable").querySelector("tbody");
  const m=$("mobileHistory");
  t.innerHTML=""; m.innerHTML="";

  if(!state.filtrado.length){
    t.innerHTML='<tr><td colspan="9">Sem registros</td></tr>';
    m.innerHTML='<p style="text-align:center;color:#888;">Sem registros</p>';
    paginar(); return;
  }

  const ini=(state.pagina-1)*state.porPagina;
  state.filtrado.slice(ini,ini+state.porPagina).forEach(r=>{
    const tr=document.createElement("tr");
    tr.onclick=()=>modal(r);
    tr.innerHTML=`
      <td>${esc(r[0])}</td><td>${fDate(r[1])}</td><td>${esc(r[2])}</td>
      <td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${fTime(r[5])}</td>
      <td>${esc(r[6])}</td><td>${esc(r[7])}</td><td>${fTime(r[8])}</td>`;
    t.appendChild(tr);

    const c=document.createElement("div");
    c.className="history-card";
    c.onclick=()=>modal(r);
    c.innerHTML=`<p><b>ID:</b> ${r[0]}</p><p><b>Data:</b> ${fDate(r[1])}</p>
                 <p><b>Executante:</b> ${esc(r[2])}</p><p><b>Equipamento:</b> ${esc(r[4])}</p>`;
    m.appendChild(c);
  });
  paginar();
}

/* ================= PAGINAÇÃO ================= */
function paginar(){
  let p=$("paginacao");
  if(!p){
    p=document.createElement("div");
    p.id="paginacao";
    p.className="paginacao";
    document.querySelector(".history").appendChild(p);
  }
  const total=Math.ceil(state.filtrado.length/state.porPagina);
  if(total<=1){p.innerHTML="";return}

  p.innerHTML=`
    <button ${state.pagina==1?"disabled":""} onclick="ir(${state.pagina-1})">«</button>
    ${Array.from({length:total},(_,i)=>`
      <button class="${state.pagina==i+1?"ativo":""}" onclick="ir(${i+1})">${i+1}</button>`).join("")}
    <button ${state.pagina==total?"disabled":""} onclick="ir(${state.pagina+1})">»</button>`;
}
function ir(p){state.pagina=p;render()}

/* ================= MODAL ================= */
function modal(r){
  state.selecionado=r;
  $("modalTitle").textContent=`Ficha Técnica - ID ${r[0]}`;
  $("modalFields").innerHTML=`
    <div><b>Executante:</b> ${esc(r[2])}</div>
    <div><b>Data:</b> ${fDate(r[1])}</div>
    <div><b>Matrícula:</b> ${esc(r[3])}</div>
    <div><b>Equipamento:</b> ${esc(r[4])}</div>
    <div><b>Acionamento:</b> ${fTime(r[5])}</div>
    <div><b>Problema:</b> ${esc(r[6])}</div>
    <div><b>Solução:</b> ${esc(r[7])}</div>
    <div><b>Encerramento:</b> ${fTime(r[8])}</div>`;

  const b=$("modalButtons");
  b.innerHTML="";
  b.append(btn("Fechar","#2d6a4f",()=>$("modalDetalhes").style.display="none"));

  if(String($("matricula").value)==String(r[3])){
    b.append(btn("Editar","#4dabf7",()=>editar(r)));
    b.append(btn("Deletar","#ff6b6b",deletar));
  }
  $("modalDetalhes").style.display="flex";
}

/* ================= CRUD ================= */
function editar(r){
  $("modalFields").innerHTML=`
    <input id="e1" value="${esc(r[2])}">
    <input type="date" id="e2" value="${new Date(r[1]).toISOString().split("T")[0]}">
    <input id="e3" value="${esc(r[4])}">
    <input type="time" id="e4" value="${r[5]?new Date(r[5]).toISOString().substr(11,5):""}">
    <textarea id="e5">${esc(r[6])}</textarea>
    <textarea id="e6">${esc(r[7])}</textarea>
    <input type="time" id="e7" value="${r[8]?new Date(r[8]).toISOString().substr(11,5):""}">`;

  const b=$("modalButtons");
  b.innerHTML="";
  b.append(btn("Salvar","#2d6a4f",async()=>{
    const ok=await gas("editarTurno",{id:r[0],matricula:$("matricula").value,
      executante:e1.value,data:e2.value,equipamento:e3.value,
      acionamento:e4.value,problema:e5.value,solucao:e6.value,encerramento:e7.value});
    if(ok?.success){alert("Atualizado");carregar($("matricula").value)}
  }));
  b.append(btn("Cancelar","#ff6b6b",()=>$("modalDetalhes").style.display="none"));
}

async function deletar(){
  if(!confirm("Deseja deletar?"))return;
  const r=state.selecionado;
  const ok=await gas("deletarTurno",{id:r[0],matricula:$("matricula").value});
  if(ok?.success){alert("Deletado");carregar($("matricula").value)}
}

/* ================= REGISTRO ================= */
$("turnoForm").onsubmit = async e=>{
  e.preventDefault();
  const p=["nome","matricula","data","equipamento","acionamento","problema","solucao","encerramento"]
    .reduce((o,i)=>(o[i]=$(`${i}`).value.trim(),o),{});
  const r=await gas("registrarTurno",p);
  if(r?.success){alert("Registro salvo");$("btnLogout").click()}
};

/* ================= WATCHDOG + PDF ================= */
setInterval(async()=>{
  try{$("watchdog").innerText="Watchdog: "+(await gas("getWatchdog")).watchdog}
  catch{$("watchdog").innerText="Watchdog: OFFLINE"}
},3000);

$("btnPDF").onclick=async()=>{
  const r=await gas("gerarPDF");
  if(r?.url)window.open(r.url);
};

/* ================= INIT ================= */
carregar("");
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>

</body>
</html>
