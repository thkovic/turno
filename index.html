<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sistema de Histórico</title>
  <style>
    body{font-family:Arial;margin:0;padding:0;background:#fff;color:#333}
    .container{max-width:1000px;margin:40px auto;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:8px}
    h1{text-align:center;color:#2d6a4f;margin-bottom:20px}
    form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    label{font-weight:600}
    input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
    textarea{min-height:70px;resize:vertical}
    .full-width{grid-column:1/-1}
    button{background:#95d5b2;color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer}
    button:hover{opacity:.95}
    #cadastroMatricula{margin-top:20px;padding:15px;border:1px solid #ccc;border-radius:8px;background:#f7f7f7}
  </style>
</head>
<body>
<div class="container">
  <h1>📝 Sistema de Histórico</h1>

  <!-- LOGIN -->
  <div id="loginDiv">
    <h3>🔐 Login</h3>
    <form id="loginForm" class="full-width">
      <div class="full-width">
        <label>Matrícula</label>
        <input id="loginMatricula" required>
      </div>
      <div class="full-width">
        <button>Entrar</button>
      </div>
    </form>
  </div>

  <!-- REGISTRO -->
  <div id="registroDiv" style="display:none;">
    <h3>Registrar Passagem</h3>
    <form id="turnoForm">
      <div><label>Nome *</label><input id="nome" required></div>
      <div><label>Matrícula *</label><input id="matricula" readonly required></div>
      <div><label>Data *</label><input type="date" id="data" required></div>
      <div><label>Equipamento *</label><input id="equipamento" required></div>
      <div><label>Acionamento *</label><input type="time" id="acionamento" required></div>
      <div class="full-width"><label>Problema *</label><textarea id="problema" required></textarea></div>
      <div class="full-width"><label>Solução</label><textarea id="solucao"></textarea></div>
      <div><label>Encerramento</label><input type="time" id="encerramento"></div>
      <div class="full-width">
        <button id="btnSubmit">Registrar</button>
        <button type="button" id="btnLogout" style="background:#ff6b6b;margin-top:8px;">Logout</button>
      </div>
    </form>
  </div>

  <!-- CADASTRO DE MATRÍCULA -->
  <div id="cadastroMatricula">
    <h3>➕ Cadastrar nova matrícula</h3>
    <form id="formMatricula">
      <input id="novaMatricula" placeholder="Matrícula" required>
      <input id="nomeMatricula" placeholder="Nome" required>
      <button>Cadastrar</button>
    </form>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec"; // substitua pelo seu link /exec

function callGAS(params) {
  const callback = "cb_" + Math.random().toString(36).slice(2,12);
  const url = GAS_URL + "?" + new URLSearchParams({...params, callback});
  return new Promise((resolve, reject) => {
    window[callback] = (data) => { resolve(data); delete window[callback]; };
    const script = document.createElement("script");
    script.src = url;
    script.onerror = () => reject(new Error("Falha na requisição JSONP"));
    document.body.appendChild(script);
  });
}

/* LOGIN */
document.getElementById("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const mat = document.getElementById("loginMatricula").value.trim();

  const res = await callGAS({acao:"validarMatricula", matricula: mat});
  console.log("Resposta da validação:", res);

  if (!res || !res.success) {
    alert("Matrícula não encontrada. Contate o administrador.");
    return;
  }

  // Preenche matrícula e nome automaticamente
  document.getElementById("matricula").value = mat;
  if (res.nome) {
    document.getElementById("nome").value = res.nome;
  }

  // Mostra área de registro
  document.getElementById("loginDiv").style.display = "none";
  document.getElementById("registroDiv").style.display = "block";
};

/* CADASTRO DE MATRÍCULA */
document.getElementById("formMatricula").onsubmit = async (e) => {
  e.preventDefault();
  const mat = document.getElementById("novaMatricula").value.trim();
  const nome = document.getElementById("nomeMatricula").value.trim();
  const res = await callGAS({acao:"adicionarMatricula", matricula: mat, nome: nome});
  alert(res.message);
};
</script>
</body>
</html>
