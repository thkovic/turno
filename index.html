<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Passagem de Turno</title>

<style>
body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f5f5f5; }
.container { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:10px; }
h2 { margin-top:0; }
label { display:block; margin-top:10px; font-weight:bold; }
input, select, textarea {
  width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;
}
button {
  padding:12px 20px; border:none; background:#007bff; color:#fff; cursor:pointer; border-radius:6px;
}
button:hover { background:#0056b3; }
table { width:100%; margin-top:20px; border-collapse:collapse; }
th, td { padding:10px; border:1px solid #ddd; text-align:left; }
th { background:#eee; }
.watchdog {
  padding:10px; border-radius:6px; margin-bottom:20px; font-weight:bold;
}
.online { background:#d4ffd4; color:#006600; }
.offline { background:#ffd4d4; color:#660000; }
</style>

</head>
<body>

<div class="container">

<h2>Sistema Passagem de Turno</h2>

<div id="watchdogBox" class="watchdog offline">
  Watchdog: <span id="watchdogStatus">OFFLINE</span><br>
  <small id="watchdogTimestamp"></small>
</div>

<!-- FORMULÁRIO -->
<label>Nome do Executante:</label>
<input id="nome">

<label>Matrícula:</label>
<input id="matricula">

<label>Equipamento:</label>
<input id="equipamento">

<label>Data:</label>
<input type="date" id="data">

<label>Acionamento:</label>
<input type="time" id="acionamento">

<label>Problema:</label>
<textarea id="problema"></textarea>

<label>Solução:</label>
<textarea id="solucao"></textarea>

<label>Encerramento:</label>
<input type="time" id="encerramento">

<button onclick="registrarTurno()">Registrar</button>

<!-- Histórico -->
<h3>Histórico</h3>
<table id="tabela">
<thead>
<tr>
  <th>ID</th>
  <th>Data</th>
  <th>Executante</th>
  <th>Matrícula</th>
  <th>Equipamento</th>
  <th>Acionamento</th>
  <th>Problema</th>
  <th>Solução</th>
  <th>Encerramento</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec";

// ------------------------
// WATCHDOG
// ------------------------
async function checkWatchdog() {
    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "watchdog" })
        });

        const data = await res.json();

        if (data.status === "ok") {
            document.getElementById("watchdogBox").classList.remove("offline");
            document.getElementById("watchdogBox").classList.add("online");

            document.getElementById("watchdogStatus").innerText = "ONLINE";
            document.getElementById("watchdogTimestamp").innerText = data.timestamp;
            return;
        }
    } catch (e) {}

    document.getElementById("watchdogBox").classList.remove("online");
    document.getElementById("watchdogBox").classList.add("offline");
    document.getElementById("watchdogStatus").innerText = "OFFLINE";
}

setInterval(checkWatchdog, 5000);
checkWatchdog();

// ------------------------
// REGISTRAR
// ------------------------
async function registrarTurno() {
    const payload = {
        nome: document.getElementById("nome").value,
        matricula: document.getElementById("matricula").value,
        equipamento: document.getElementById("equipamento").value,
        data: document.getElementById("data").value,
        acionamento: document.getElementById("acionamento").value,
        problema: document.getElementById("problema").value,
        solucao: document.getElementById("solucao").value,
        encerramento: document.getElementById("encerramento").value
    };

    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "registrar", data: payload })
    });

    const dataRes = await res.json();
    alert("Registro salvo! ID: " + dataRes.id);

    carregarHistorico();
}

// ------------------------
// HISTÓRICO
// ------------------------
async function carregarHistorico() {
    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "historico" })
    });

    const lista = await res.json();
    const tbody = document.querySelector("#tabela tbody");
    tbody.innerHTML = "";

    lista.forEach(l => {
        const tr = document.createElement("tr");
        l.forEach(v => {
            const td = document.createElement("td");
            td.textContent = v;
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

carregarHistorico();
</script>

</body>
</html>
