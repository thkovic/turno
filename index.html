<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Histórico</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
}

/* Usuário logado */
.top-user {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #f3f3f3;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
}
</style>
</head>

<body>

<script>
/* 🔐 PROTEÇÃO GLOBAL – LOGIN APENAS NO teste.html */
const matricula = localStorage.getItem("usuario_logado");
const nome = localStorage.getItem("usuario_nome");

if (!matricula) {
    window.location.href = "teste.html";
}
</script>

<!-- USUÁRIO LOGADO -->
<div class="top-user">
    Usuário: <span id="usuarioTopo"></span>
</div>

<script>
document.getElementById("usuarioTopo").innerText =
    nome ? `${nome} (${matricula})` : matricula;
</script>

<h1>📝 Sistema de Histórico</h1>

<!-- 🔹 REGISTRO DE PASSAGEM -->
<h2>Registrar Passagem</h2>

<form id="formRegistro">
    <label>Nome *</label><br>
    <input type="text" id="nome"><br><br>

    <label>Matrícula *</label><br>
    <input type="text" id="matricula" readonly><br><br>

    <label>Data *</label><br>
    <input type="date" id="data"><br><br>

    <label>Equipamento *</label><br>
    <input type="text" id="equipamento"><br><br>

    <label>Acionamento *</label><br>
    <input type="text" id="acionamento"><br><br>

    <label>Problema *</label><br>
    <textarea id="problema"></textarea><br><br>

    <label>Solução</label><br>
    <textarea id="solucao"></textarea><br><br>

    <label>Encerramento</label><br>
    <textarea id="encerramento"></textarea><br><br>

    <button type="button">Registrar</button>
</form>

<script>
/* Preenche dados do usuário logado automaticamente */
document.getElementById("nome").value = nome || "";
document.getElementById("matricula").value = matricula;
</script>

<hr>

<h2>📊 Histórico de Registros</h2>

<table border="1" width="100%">
<thead>
<tr>
    <th>ID</th>
    <th>Data</th>
    <th>Executante</th>
    <th>Matrícula</th>
    <th>Equipamento</th>
    <th>Acionamento</th>
    <th>Problema</th>
    <th>Solução</th>
    <th>Encerramento</th>
</tr>
</thead>
<tbody>
<tr>
    <td colspan="9">Carregando...</td>
</tr>
</tbody>
</table>

<br>

<button>📄 Gerar EXCEL</button>
<button>📈 Ver Ranking</button>

</body>
</html>
