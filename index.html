<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Passagem de Turno</title>

<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
    .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    button { cursor: pointer; background: #4caf50; border: none; padding: 10px; color: white; border-radius: 6px; }
</style>
</head>

<body>
<div class="container">

<h2>Sistema de Passagem de Turno</h2>

<form id="turnoForm">

    <label>ID</label>
    <input type="text" id="id" readonly><br><br>

    <label>Data da Ocorrência</label>
    <input type="text" id="dataOcorrencia"><br><br>

    <label>Operador</label>
    <input type="text" id="operador"><br><br>

    <label>Matrícula</label>
    <input type="text" id="matricula"><br><br>

    <label>Equipamento</label>
    <input type="text" id="equipamento"><br><br>

    <label>Acionamento</label>
    <input type="text" id="acionamento"><br><br>

    <label>Problema</label>
    <textarea id="problema"></textarea><br><br>

    <label>Solução</label>
    <textarea id="solucao"></textarea><br><br>

    <label>Encerramento</label>
    <input type="text" id="encerramento"><br><br>

    <!-- BOTÕES -->
    <button type="submit" id="btnSubmit">✅ Registrar Passagem de Turno</button>
    <button type="button" id="btnLogout" style="background:#ff5959;">🚪 Logout</button>
    <button type="button" id="btnLimpar" style="background:#ff9800;">🗑️ Limpar Planilha</button>
    <button type="button" id="btnRecriarPlanilha" style="background:#ffa726;">🔄 Recriar Planilha</button>

</form>

<br><hr><br>

<h3>Histórico</h3>
<div id="history"></div>

</div>

<script>
/* ========================
      CONFIGURAÇÕES
======================== */

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzeJq9-6myS9yGKlZA7e2fLDAcMSgXEN_uK70g-DeA2xqaITIdNwDRKZ9040luMPGpf/exec";

/* ========================
      FUNÇÃO POST
======================== */

async function postData(dados) {
    const response = await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
    });

    const text = await response.text();

    try {
        return JSON.parse(text);
    } catch(e) {
        console.error("Resposta retornou HTML:", text);
        throw new Error("O servidor retornou conteúdo inválido (HTML).");
    }
}

/* ========================
      EVENTOS DO SISTEMA
======================== */

// Registrar passagem de turno
document.getElementById("turnoForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const dados = {
        id: document.getElementById("id").value,
        dataOcorrencia: document.getElementById("dataOcorrencia").value,
        operador: document.getElementById("operador").value,
        matricula: document.getElementById("matricula").value,
        equipamento: document.getElementById("equipamento").value,
        acionamento: document.getElementById("acionamento").value,
        problema: document.getElementById("problema").value,
        solucao: document.getElementById("solucao").value,
        encerramento: document.getElementById("encerramento").value
    };

    const resp = await postData(dados);

    alert("Registrado com sucesso!");
});

// LIMPAR PLANILHA
document.getElementById("btnLimpar").addEventListener("click", async () => {
    if (!confirm("Deseja realmente apagar TODOS os registros?")) return;

    const resp = await postData({ limpar: true });

    alert(resp.message);
});

// RECRIAR PLANILHA
document.getElementById("btnRecriarPlanilha").addEventListener("click", async () => {
    if (!confirm("⚠️ Isso vai APAGAR TUDO e recriar a planilha!")) return;

    const resp = await postData({ recriarPlanilha: true });

    alert(resp.message);
});

// LOGOUT
document.getElementById("btnLogout").addEventListener("click", () => {
    alert("Logout efetuado.");
});

/* ========================
      CARREGAR HISTÓRICO
======================== */

async function loadHistory() {
    const resp = await postData({ history: true });

    let html = "<table border='1' width='100%'><tr>";

    resp.data.forEach(col => html += `<th>${col}</th>`);
    html += "</tr>";

    resp.rows.forEach(row => {
        html += "<tr>";
        row.forEach(c => html += `<td>${c}</td>`);
        html += "</tr>";
    });

    html += "</table>";

    document.getElementById("history").innerHTML = html;
}

loadHistory();

</script>

</body>
</html>
