<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sistema de Histórico</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f5f5f5;
}
.container {
    max-width: 1150px;
    margin: 30px auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #2d6a4f;
}

input, select, button {
    padding: 8px;
    margin: 5px 0;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    cursor: pointer;
    background: #2d6a4f;
    color: white;
    border: none;
    transition: 0.3s;
}

button:hover {
    background: #1b4634;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

table th, table td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
    font-size: 14px;
}

table th {
    background: #2d6a4f;
    color: white;
}

#busca {
    margin-top: 20px;
    width: 300px;
}

.actions {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}
</style>

<!-- Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.19.3/xlsx.full.min.js"></script>

<!-- jsPDF + autoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

</head>
<body>

<div class="container">
    <h1>Sistema de Histórico</h1>

    <input type="text" id="busca" placeholder="Buscar no histórico..." oninput="filtrarHistorico()">

    <div class="actions">
        <button onclick="carregarHistorico()">Atualizar Histórico</button>
        <button onclick="gerarExcel()">Gerar Excel</button>
        <button onclick="gerarPDF()">Gerar PDF</button>
    </div>

    <table id="tabelaHistorico">
        <thead>
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Executante</th>
                <th>Matrícula</th>
                <th>Equipamento</th>
                <th>Acionamento</th>
                <th>Problema</th>
                <th>Solução</th>
                <th>Encerramento</th>
            </tr>
        </thead>
        <tbody id="conteudoTabela">
            <tr><td colspan="9">Carregando…</td></tr>
        </tbody>
    </table>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec";

async function carregarHistorico() {
    try {
        const resposta = await fetch(API_URL + "?acao=buscarTudo");
        const dados = await resposta.json();

        if (!dados || !Array.isArray(dados)) {
            document.getElementById("conteudoTabela").innerHTML =
                "<tr><td colspan='9'>Nenhum registro encontrado</td></tr>";
            return;
        }

        preencherTabela(dados);

    } catch (e) {
        document.getElementById("conteudoTabela").innerHTML =
            "<tr><td colspan='9'>Erro ao carregar dados</td></tr>";
    }
}

function preencherTabela(lista) {
    let html = "";
    lista.forEach(linha => {
        html += `
            <tr>
                <td>${linha.ID}</td>
                <td>${linha.Data}</td>
                <td>${linha.Executante}</td>
                <td>${linha.Matricula}</td>
                <td>${linha.Equipamento}</td>
                <td>${linha.Acionamento}</td>
                <td>${linha.Problema}</td>
                <td>${linha.Solucao}</td>
                <td>${linha.Encerramento}</td>
            </tr>
        `;
    });
    document.getElementById("conteudoTabela").innerHTML = html;
}

function filtrarHistorico() {
    let termo = document.getElementById("busca").value.toLowerCase();
    let linhas = document.querySelectorAll("#tabelaHistorico tbody tr");

    linhas.forEach(linha => {
        let texto = linha.innerText.toLowerCase();
        linha.style.display = texto.includes(termo) ? "" : "none";
    });
}

function gerarExcel() {
    let linhas = document.querySelectorAll("#tabelaHistorico tbody tr");
    let dadosExcel = [];

    linhas.forEach(linha => {
        if (linha.style.display !== "none") {
            let colunas = linha.querySelectorAll("td");
            let registro = [];
            colunas.forEach(col => registro.push(col.innerText));
            dadosExcel.push(registro);
        }
    });

    if (dadosExcel.length === 0) {
        return gerarExcelCompleto();
    }

    dadosExcel.unshift([
        "ID","Data","Executante","Matrícula","Equipamento",
        "Acionamento","Problema","Solução","Encerramento"
    ]);

    let planilha = XLSX.utils.aoa_to_sheet(dadosExcel);
    let wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, planilha, "Filtrado");

    XLSX.writeFile(wb, "historico_filtrado.xlsx");
}

async function gerarExcelCompleto() {
    const resposta = await fetch(API_URL + "?acao=buscarTudo");
    const dados = await resposta.json();

    let linhas = [
        ["ID","Data","Executante","Matrícula","Equipamento",
        "Acionamento","Problema","Solução","Encerramento"]
    ];

    dados.forEach(l => {
        linhas.push([
            l.ID, l.Data, l.Executante, l.Matricula, l.Equipamento,
            l.Acionamento, l.Problema, l.Solucao, l.Encerramento
        ]);
    });

    let plan = XLSX.utils.aoa_to_sheet(linhas);
    let wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, plan, "Histórico Completo");

    XLSX.writeFile(wb, "historico_completo.xlsx");
}

/* ============================
   PDF COM QUEBRA DE LINHA
   ============================ */
function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'pt', 'a4'); // horizontal para caber mais conteúdo
    
    doc.text("Histórico Completo", 40, 40);

    doc.autoTable({
        html: '#tabelaHistorico',
        startY: 60,
        theme: 'grid',
        styles: {
            fontSize: 8,
            cellPadding: 4,
            valign: 'top',
            overflow: 'linebreak'
        },
        columnStyles: {
            0: { cellWidth: 40 },
            1: { cellWidth: 60 },
            2: { cellWidth: 80 },
            3: { cellWidth: 60 },
            4: { cellWidth: 80 },
            5: { cellWidth: 80 },
            6: { cellWidth: 150 }, 
            7: { cellWidth: 150 }, 
            8: { cellWidth: 80 }
        }
    });

    doc.save("historico.pdf");
}

window.onload = carregarHistorico;

</script>

</body>
</html>
