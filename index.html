<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d6a4f">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sistema de Histórico</title>

  <!-- jsPDF para gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* estilos resumidos apenas para manter tudo igual */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f0f4f1;
  color: #1b4332;
}
.container {
  max-width: 1100px;
  margin: 20px auto;
  padding: 20px;
}
h1 {
  text-align: center;
  color: #2d6a4f;
  margin-bottom: 20px;
}
.form-box, .history-box {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.1);
}
label { font-weight: bold; }
input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 1px solid #b7e4c7;
}
button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
.save-btn { background: #2d6a4f; color: white; }
.save-btn:hover { background: #1b4332; }
.pdf-btn { background: #40916c; color: white; }
.pdf-btn:hover { background: #2d6a4f; }
.logout-btn { background: #e63946; color: white; float:right; }
.history-item {
  padding: 12px;
  border-bottom: 1px solid #ccc;
}
.history-item strong { color: #1b4332; }
</style>
</head>

<body>
<div class="container">

  <h1>Sistema de Histórico</h1>

  <button class="logout-btn" onclick="logout()">Sair</button>

  <div class="form-box">
    <h2>Novo Registro</h2>

    <label>Executante:</label>
    <input type="text" id="executante">

    <label>Matrícula:</label>
    <input type="text" id="matricula">

    <label>Equipamento:</label>
    <input type="text" id="equipamento">

    <label>Acionamento:</label>
    <input type="datetime-local" id="acionamento">

    <label>Problema:</label>
    <textarea id="problema"></textarea>

    <label>Solução:</label>
    <textarea id="solucao"></textarea>

    <label>Encerramento:</label>
    <input type="datetime-local" id="encerramento">

    <button class="save-btn" id="btnSalvar">Salvar Registro</button>
  </div>

  <div class="history-box">
    <h2>Histórico</h2>

    <button class="pdf-btn" id="btnPDF">📄 Gerar PDF</button>

    <div id="historyList">Carregando...</div>
  </div>

</div>

<script>
/* ---- VARIÁVEIS ---- */
let fullHistory = [];

/* ---- FORMATADORES ---- */
function formatDate(d) {
    if (!d) return "";
    return new Date(d).toLocaleDateString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function formatTime(d) {
    if (!d) return "";
    return new Date(d).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

/* ---- SALVAR ---- */
document.getElementById("btnSalvar").addEventListener("click", () => {
    alert("Registro salvo! (Simulação — integre ao GAS)");
});

/* ---- CARREGAR HISTÓRICO (simulado) ---- */
function loadHistory() {
    fullHistory = [
        [1, "2025-12-08T10:00", "Carlos", "238721", "Motor 01", "2025-12-08T09:00", "Ruído", "Apertado parafusos", "2025-12-08T10:30"],
        [2, "2025-12-07T15:00", "Joana", "998172", "Bomba 02", "2025-12-07T14:00", "Vazamento", "Trocado vedação", "2025-12-07T15:20"],
    ];

    renderHistory();
}
loadHistory();

/* ---- RENDERIZAR HISTÓRICO ---- */
function renderHistory() {
    const div = document.getElementById("historyList");
    div.innerHTML = "";

    if (fullHistory.length === 0) {
        div.innerHTML = "<p>Sem registros.</p>";
        return;
    }

    fullHistory.forEach(r => {
        div.innerHTML += `
            <div class="history-item">
                <strong>ID:</strong> ${r[0]}<br>
                <strong>Data:</strong> ${formatDate(r[1])}<br>
                <strong>Executante:</strong> ${r[2]}<br>
                <strong>Matrícula:</strong> ${r[3]}<br>
                <strong>Equipamento:</strong> ${r[4]}<br>
                <strong>Acionamento:</strong> ${formatTime(r[5])}<br>
                <strong>Problema:</strong> ${r[6]}<br>
                <strong>Solução:</strong> ${r[7]}<br>
                <strong>Encerramento:</strong> ${formatTime(r[8])}
            </div>
        `;
    });
}

/* ---- GERAR PDF ---- */
document.getElementById("btnPDF").addEventListener("click", () => {

    if (!fullHistory || fullHistory.length === 0) {
        alert("Sem registros para gerar PDF.");
        return;
    }

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "landscape" });

    pdf.setFontSize(14);
    pdf.text("Histórico de Registros", 14, 10);

    let y = 20;

    const header = [
        "ID", "Data", "Executante", "Matrícula", "Equipamento",
        "Acionamento", "Problema", "Solução", "Encerramento"
    ];

    pdf.setFontSize(10);

    function addRow(arr) {
        arr.forEach((txt, i) => {
            pdf.text(String(txt).substring(0, 40), 14 + (i * 30), y);
        });
        y += 8;

        if (y > 190) {
            pdf.addPage();
            y = 20;
        }
    }

    addRow(header);

    fullHistory.forEach(r => {
        addRow([
            r[0],
            formatDate(r[1]),
            r[2],
            r[3],
            r[4],
            formatTime(r[5]),
            r[6],
            r[7],
            formatTime(r[8])
        ]);
    });

    pdf.save("historico.pdf");
});

/* ---- LOGOUT ---- */
function logout() {
    alert("Logout executado!");
}
</script>

</body>
</html>
