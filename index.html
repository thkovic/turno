<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sistema de Histórico</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="watchdog">Watchdog: --</div>
  <div class="container">
    <h1>📝 Sistema de Histórico</h1>

    <!-- -------------------- LOGIN -------------------- -->
    <div id="loginDiv">
      <h3>🔐 Login</h3>
      <form id="loginForm" class="full-width">
        <div class="full-width">
          <label>Matrícula</label>
          <input id="loginMatricula" required>
        </div>
        <div class="full-width">
          <button>Entrar</button>
        </div>
      </form>
    </div>

    <!-- -------------------- REGISTRO -------------------- -->
    <div id="registroDiv" style="display:none;">
      <h3>Registrar Passagem</h3>
      <form id="turnoForm">
        <div><label>Nome *</label><input id="nome" required></div>
        <div><label>Matrícula *</label><input id="matricula" readonly required></div>
        <div><label>Data *</label><input type="date" id="data" required></div>
        <div><label>Equipamento *</label><input id="equipamento" required></div>
        <div><label>Acionamento *</label><input type="time" id="acionamento" required></div>
        <div class="full-width"><label>Problema *</label><textarea id="problema" required></textarea></div>
        <div class="full-width"><label>Solução *</label><textarea id="solucao" required></textarea></div>
        <div><label>Encerramento *</label><input type="time" id="encerramento" required></div>
        <div class="full-width">
          <button id="btnSubmit">Registrar</button>
          <button type="button" id="btnLogout" style="background:#ff6b6b;margin-top:8px;">Logout</button>
        </div>
      </form>
    </div>

    <!-- -------------------- BOTÃO DE LOG -------------------- -->
    <div id="logDiv" style="display:none; margin-top:15px;">
      <button id="btnLog" style="background:#1d3557;">📜 Sistema de Log</button>
    </div>

    <!-- -------------------- BUSCA + PDF -------------------- -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar histórico (ID, nome, equipamento)">
      <button class="pdf-btn" id="btnPDF">📄 Gerar PDF</button>
    </div>

    <!-- -------------------- HISTÓRICO -------------------- -->
    <div class="history">
      <h3>📊 Histórico de Registros</h3>
      <table id="historyTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Executante</th>
            <th>Matrícula</th>
            <th>Equipamento</th>
            <th>Acionamento</th>
            <th>Problema</th>
            <th>Solução</th>
            <th>Encerramento</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="9">Carregando...</td></tr>
        </tbody>
      </table>
      <div id="mobileHistory"></div>
    </div>
  </div>

  <!-- -------------------- MODAL -------------------- -->
  <div class="modal" id="modalDetalhes">
    <div class="modal-content">
      <h2>Ficha Técnica</h2>
      <div id="modalFields"></div>
      <div id="modalButtons" style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button onclick="fecharModal()" style="background:#2d6a4f;">Fechar</button>
      </div>
    </div>
  </div>

  <!-- JS externo -->
  <script src="app.js"></script>
</body>
</html>
