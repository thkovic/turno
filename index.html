<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App Script</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3367d6">
</head>
<body>
  <!-- Seu conteúdo ou redirecionamento para o código.gs -->
  <script>
    // Exemplo: redirecionar para seu Apps Script
    window.location.href = "https://script.google.com/macros/s/AKfycbwX-BekAmJzqcoSd5J9w0tyYC_Ow4K7AjO0LspNe_E/dev";
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service Worker registrado"))
        .catch(err => console.error("Erro no SW:", err));
    }
  </script>
</body>
</html>
