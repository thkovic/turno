<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sistema de Histórico</title>
<style>
/* ---------- Estilos (mantive seu visual) ---------- */
body{font-family:Arial;margin:0;padding:0;background:#fff;color:#333}
.container{max-width:1000px;margin:40px auto;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:8px}
h1{text-align:center;color:#2d6a4f;margin-bottom:20px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label{font-weight:600}
input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
.full-width{grid-column:1/-1}
button{background:#95d5b2;color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer}
button:hover{opacity:.95}
#watchdog{position:fixed;top:10px;right:10px;background:#95d5b2;color:#fff;padding:6px 10px;border-radius:6px;font-weight:bold}
.history table{width:100%;border-collapse:collapse;font-size:13px}
.history th,.history td{border:1px solid #ddd;padding:8px;text-align:left;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history th{background:#e9f5ef;color:#2d6a4f}
#mobileHistory{display:none}
.history-card{background:#f7f7f7;padding:14px;margin:12px 0;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:#fff;padding:20px;border-radius:10px;max-width:700px;width:95%;max-height:90%;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tech-field{margin-bottom:12px}
.search-bar{display:flex;gap:10px;margin-bottom:15px}
.search-bar input{flex:1}
.pdf-btn{background:#2d6a4f;margin-left:10px}
.small{font-size:12px;color:#666}
@media(max-width:1200px){
  .container{width:95%;margin:10px auto;padding:12px;box-shadow:none}
  form{grid-template-columns:1fr}
  button{width:100%;padding:14px;font-size:16px}
  #historyTable{display:none}
  #mobileHistory{display:block}
  .search-bar{flex-direction:column}
  .pdf-btn{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div id="watchdog">Watchdog: --</div>
<div class="container">
  <h1>📝 Sistema de Histórico</h1>

  <!-- LOGIN -->
  <div id="loginDiv">
    <h3>🔐 Login</h3>
    <form id="loginForm" class="full-width">
      <div class="full-width">
        <label>Matrícula</label>
        <input id="loginMatricula" required>
      </div>
      <div class="full-width">
        <button>Entrar</button>
      </div>
    </form>
  </div>

  <!-- REGISTRO -->
  <div id="registroDiv" style="display:none;">
    <h3>Registrar Passagem</h3>
    <form id="turnoForm">
      <div><label>Nome *</label><input id="nome" required></div>
      <div><label>Matrícula *</label><input id="matricula" readonly required></div>
      <div><label>Data *</label><input type="date" id="data" required></div>
      <div><label>Equipamento *</label><input id="equipamento" required></div>
      <div><label>Acionamento *</label><input type="time" id="acionamento" required></div>
      <div class="full-width"><label>Problema *</label><textarea id="problema" required></textarea></div>
      <div class="full-width"><label>Solução</label><textarea id="solucao"></textarea></div>
      <div><label>Encerramento</label><input type="time" id="encerramento"></div>
      <div class="full-width">
        <button id="btnSubmit">Registrar</button>
        <button type="button" id="btnLogout" style="background:#ff6b6b;margin-top:8px;">Logout</button>
      </div>
    </form>
  </div>

  <div id="logDiv" style="display:none; margin-top:15px;">
    <button id="btnLog" style="background:#1d3557;">📜 Sistema de Log</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar histórico (ID, nome, equipamento)">
    <button class="pdf-btn" id="btnPDF">📄 Gerar PDF</button>
  </div>

  <div class="history">
    <h3>📊 Histórico de Registros</h3>
    <table id="historyTable">
      <thead>
        <tr>
          <th>ID</th><th>Data</th><th>Executante</th><th>Matrícula</th><th>Equipamento</th><th>Acionamento</th><th>Problema</th><th>Solução</th><th>Encerramento</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="9">Carregando...</td></tr>
      </tbody>
    </table>
    <div id="mobileHistory"></div>
  </div>
</div>

<!-- MODAL (edição dentro do modal) -->
<div class="modal" id="modalDetalhes" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true">
    <h2 id="modalTitle">Ficha Técnica</h2>
    <div id="modalFields"></div>
    <div id="modalButtons" style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;"></div>
  </div>
</div>

<script>
/* ================== CONFIGURAÇÃO ================== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyjN_7typwQ8yFu-4CW6uRV9U4U6z1386BcGz3YAl_-di_KXedC2FFg3NEAIDjuL4ir/exec";

/* ================== ELEMENTOS ================== */
const loginForm = document.getElementById("loginForm");
const loginDiv = document.getElementById("loginDiv");
const registroDiv = document.getElementById("registroDiv");
const matricula = document.getElementById("matricula");
const turnoForm = document.getElementById("turnoForm");
const searchInput = document.getElementById("searchInput");
const btnPDF = document.getElementById("btnPDF");
const modalDetalhes = document.getElementById("modalDetalhes");
const modalFields = document.getElementById("modalFields");
const modalButtons = document.getElementById("modalButtons");
const watchdogEl = document.getElementById("watchdog");
const logDiv = document.getElementById("logDiv");

let fullHistory = [];
let registroSelecionado = null;
let modalEditMode = false; // controla se modal está em modo edição

/* ================== JSONP helper ================== */
function callGAS(params) {
    const callback = "cb_" + Math.random().toString(36).slice(2,12);
    const url = GAS_URL + "?" + new URLSearchParams({...params, callback});
    return new Promise((resolve, reject) => {
        window[callback] = (data) => {
            resolve(data);
            try { delete window[callback]; } catch(e){}
        };
        const script = document.createElement("script");
        script.src = url;
        script.onerror = () => {
            reject(new Error("Falha na requisição JSONP"));
            try { delete window[callback]; } catch(e){}
        };
        document.body.appendChild(script);
    });
}

/* ================== LOGIN / LOGOUT ================== */
loginForm.onsubmit = async e => {
    e.preventDefault();
    const mat = document.getElementById("loginMatricula").value.trim();
    if(!mat) return alert("Informe a matrícula.");
    loginDiv.style.display = "none";
    registroDiv.style.display = "block";
    matricula.value = mat;
    await loadHistory(mat);
    logDiv.style.display = (mat === "991631240") ? "block" : "none";
    await callGAS({acao:"registrarLog", matricula: mat, acaoTipo:"Login"});
};

document.getElementById("btnLogout").onclick = async () => {
    await callGAS({acao:"registrarLog", matricula: matricula.value, acaoTipo:"Logout"});
    registroDiv.style.display = "none";
    loginDiv.style.display = "block";
    turnoForm.reset();
    matricula.value = "";
    await loadHistory("");
    logDiv.style.display = "none";
};

/* ================== CARREGAR HISTÓRICO ================== */
async function loadHistory(matriculaFiltro="") {
    try {
        const data = await callGAS({acao:"getHistorico", matricula: matriculaFiltro});
        fullHistory = Array.isArray(data) ? data : (data && data.length ? data : []);
    } catch(err) {
        console.error("Erro ao carregar histórico:", err);
        fullHistory = [];
    }
    renderHistory(fullHistory);
    return fullHistory;
}

/* ================== RENDER HISTÓRICO ================== */
function renderHistory(data) {
    const t = document.querySelector("#historyTable tbody");
    const m = document.getElementById("mobileHistory");
    t.innerHTML = ""; m.innerHTML = "";
    if(!Array.isArray(data) || data.length === 0) {
        t.innerHTML = '<tr><td colspan="9">Sem registros</td></tr>';
        m.innerHTML = '<p style="text-align:center;color:#888;">Sem registros</p>';
        return;
    }
    const searchTerm = (searchInput.value || "").toLowerCase();
    data
      .filter(r => r.some(c => String(c || "").toLowerCase().includes(searchTerm)))
      .forEach(r => {
          const tr = document.createElement("tr");
          tr.dataset.id = String(r[0]);
          tr.addEventListener("click", () => abrirModal(r));
          for (let i=0; i<9; i++){
              const td = document.createElement("td");
              td.textContent = formatCell(r[i]);
              tr.appendChild(td);
          }
          t.appendChild(tr);

          const card = document.createElement("div");
          card.className = "history-card";
          card.dataset.id = String(r[0]);
          card.addEventListener("click", () => abrirModal(r));
          card.innerHTML = `<p><strong>ID:</strong> ${r[0]}</p>
                            <p><strong>Data:</strong> ${formatCell(r[1])}</p>
                            <p><strong>Executante:</strong> ${escapeHtml(r[2])}</p>
                            <p><strong>Equipamento:</strong> ${escapeHtml(r[4])}</p>`;
          m.appendChild(card);
      });
}
searchInput.oninput = () => renderHistory(fullHistory);

/* ================== UTILITÁRIOS ================== */
function formatCell(value){
    if(value === null || value === undefined || value === "") return "";
    const s = String(value);
    if(s.match(/^\d{4}-\d{2}-\d{2}T/)) {
        try {
            const d = new Date(s);
            if(!isNaN(d)){
                return `${d.toLocaleString()}`;
            }
        } catch(e){}
    }
    return s;
}
function escapeHtml(s){
    if(s === null || s === undefined) return "";
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;");
}
function formatDateForInput(raw){
    if(!raw) return "";
    try{
        const d = new Date(raw);
        if(isNaN(d)) return "";
        return d.toISOString().slice(0,10);
    }catch(e){ return ""; }
}
function formatTimeForInput(raw){
    if(!raw) return "";
    try{
        const d = new Date(raw);
        if(isNaN(d)) return "";
        return d.toISOString().slice(11,16);
    }catch(e){ return ""; }
}

/* ================== MODAL (edição dentro do modal) ================== */
function abrirModal(r){
    registroSelecionado = r;
    modalEditMode = false;
    modalTitle = document.getElementById("modalTitle");
    modalTitle.textContent = `Ficha Técnica - ID ${r[0]}`;

    modalFields.innerHTML = `
      <div class="tech-field"><strong>ID:</strong> ${escapeHtml(r[0])}</div>
      <div class="tech-field"><strong>Data:</strong> <span id="fld_data">${escapeHtml(formatCell(r[1]))}</span></div>
      <div class="tech-field"><strong>Executante:</strong> <span id="fld_nome">${escapeHtml(r[2])}</span></div>
      <div class="tech-field"><strong>Matrícula:</strong> <span id="fld_matricula">${escapeHtml(r[3])}</span></div>
      <div class="tech-field"><strong>Equipamento:</strong> <span id="fld_equip">${escapeHtml(r[4])}</span></div>
      <div class="tech-field"><strong>Acionamento:</strong> <span id="fld_acion">${escapeHtml(formatCell(r[5]))}</span></div>
      <div class="tech-field"><strong>Problema:</strong><div id="fld_prob">${escapeHtml(r[6])}</div></div>
      <div class="tech-field"><strong>Solução:</strong><div id="fld_sol">${escapeHtml(r[7])}</div></div>
      <div class="tech-field"><strong>Encerramento:</strong> <span id="fld_enc">${escapeHtml(formatCell(r[8]))}</span></div>
    `;

    // botões
    modalButtons.innerHTML = "";
    const btnFechar = document.createElement("button");
    btnFechar.textContent = "Fechar";
    btnFechar.style.background = "#2d6a4f";
    btnFechar.addEventListener("click", fecharModal);
    modalButtons.appendChild(btnFechar);

    // se matricula logada == do registro, permite editar/deletar
    if (String((matricula.value || "")).trim() === String(r[3]).trim()) {
        const btnEditar = document.createElement("button");
        btnEditar.textContent = "Editar";
        btnEditar.style.background = "#4dabf7";
        btnEditar.addEventListener("click", () => enterModalEditMode());
        modalButtons.appendChild(btnEditar);

        const btnDeletar = document.createElement("button");
        btnDeletar.textContent = "Deletar";
        btnDeletar.style.background = "#ff6b6b";
        btnDeletar.addEventListener("click", () => confirmAndDelete());
        modalButtons.appendChild(btnDeletar);
    }

    modalDetalhes.style.display = "flex";
}

/* entra em modo edição dentro do modal (substitui spans por inputs) */
function enterModalEditMode(){
    if(!registroSelecionado) return;
    modalEditMode = true;
    const r = registroSelecionado;

    // substitui o conteúdo por inputs
    modalFields.innerHTML = `
      <div class="tech-field"><strong>ID:</strong> ${escapeHtml(r[0])}</div>

      <div class="tech-field"><label>Data</label><input type="date" id="edit_data" value="${formatDateForInput(r[1])}"></div>
      <div class="tech-field"><label>Executante</label><input type="text" id="edit_nome" value="${escapeHtml(r[2])}"></div>
      <div class="tech-field"><label>Matrícula</label><input type="text" id="edit_matricula" value="${escapeHtml(r[3])}" readonly></div>
      <div class="tech-field"><label>Equipamento</label><input type="text" id="edit_equip" value="${escapeHtml(r[4])}"></div>
      <div class="tech-field"><label>Acionamento</label><input type="time" id="edit_acion" value="${formatTimeForInput(r[5])}"></div>
      <div class="tech-field"><label>Problema</label><textarea id="edit_prob">${escapeHtml(r[6])}</textarea></div>
      <div class="tech-field"><label>Solução</label><textarea id="edit_sol">${escapeHtml(r[7])}</textarea></div>
      <div class="tech-field"><label>Encerramento</label><input type="time" id="edit_enc" value="${formatTimeForInput(r[8])}"></div>
    `;

    // botões de edição: cancelar / salvar
    modalButtons.innerHTML = "";

    const btnCancelar = document.createElement("button");
    btnCancelar.textContent = "Cancelar";
    btnCancelar.style.background = "#6c757d";
    btnCancelar.addEventListener("click", () => {
        modalEditMode = false;
        abrirModal(registroSelecionado); // reabre em modo visual
    });
    modalButtons.appendChild(btnCancelar);

    const btnSalvar = document.createElement("button");
    btnSalvar.textContent = "Salvar";
    btnSalvar.style.background = "#2d6a4f";
    btnSalvar.addEventListener("click", async () => {
        // monta payload conforme seu GAS espera
        const payload = {
            acao: "editarTurno",
            id: String(registroSelecionado[0]),
            nome: document.getElementById("edit_nome").value.trim(),
            matricula: document.getElementById("edit_matricula").value.trim(),
            data: document.getElementById("edit_data").value || "",
            equipamento: document.getElementById("edit_equip").value.trim(),
            acionamento: document.getElementById("edit_acion").value || "",
            problema: document.getElementById("edit_prob").value.trim(),
            solucao: document.getElementById("edit_sol").value.trim(),
            encerramento: document.getElementById("edit_enc").value || ""
        };
        try {
            const res = await callGAS(payload);
            if(res && res.success){
                alert("Registro atualizado com sucesso!");
                location.reload(); // conforme solicitado: atualiza a página inteira
            } else {
                alert("Erro ao atualizar: " + (res && res.message ? res.message : "desconhecido"));
            }
        } catch(e) {
            alert("Falha na requisição de edição.");
        }
    });
    modalButtons.appendChild(btnSalvar);
}

/* confirma e deleta (chama GAS) */
async function confirmAndDelete(){
    if(!registroSelecionado) return;
    if(!confirm(`Deseja realmente deletar o registro ID ${registroSelecionado[0]}?`)) return;
    try {
        const res = await callGAS({acao:"deletarTurno", id: String(registroSelecionado[0]), matricula: String(matricula.value || "")});
        if(res && res.success){
            alert("Registro deletado.");
            location.reload(); // recarrega tudo
        } else {
            alert("Erro ao deletar: " + (res && res.message ? res.message : "desconhecido"));
        }
    } catch(e) {
        alert("Falha na requisição de deleção.");
    }
}

/* fechar modal */
function fecharModal(){
    modalDetalhes.style.display = "none";
    registroSelecionado = null;
    modalEditMode = false;
}

/* ================== REGISTRAR (form principal) ================== */
turnoForm.onsubmit = async e => {
    e.preventDefault();
    // se estiver em modo edição via form (neste fluxo não usamos form para editar — edição é pelo modal),
    // então tratamos como novo registro apenas
    const payload = {
        acao: "registrarTurno",
        nome: document.getElementById("nome").value.trim(),
        matricula: document.getElementById("matricula").value.trim(),
        data: document.getElementById("data").value || "",
        equipamento: document.getElementById("equipamento").value.trim(),
        acionamento: document.getElementById("acionamento").value || "",
        problema: document.getElementById("problema").value.trim(),
        solucao: document.getElementById("solucao").value.trim(),
        encerramento: document.getElementById("encerramento").value || ""
    };
    try {
        const res = await callGAS(payload);
        if(res && res.success){
            alert("Registro salvo!");
            // solicitado: recarregar a página inteira
            location.reload();
        } else {
            alert("Erro ao salvar: " + (res && res.message ? res.message : "desconhecido"));
        }
    } catch(e) {
        alert("Falha na requisição de registro.");
    }
};

/* ================== WATCHDOG ================== */
async function atualizarWatchdog(){
    try{
        const r = await callGAS({acao:"getWatchdog"});
        watchdogEl.innerText = "Watchdog: " + (r && r.watchdog !== undefined ? r.watchdog : "OFFLINE");
    } catch(e) {
        watchdogEl.innerText = "Watchdog: OFFLINE";
    }
}
setInterval(atualizarWatchdog, 3000);
atualizarWatchdog();

/* ================== PDF ================== */
btnPDF.onclick = async () => {
    try {
        const r = await callGAS({acao:"gerarPDF"});
        if(r && r.url){
            window.open(r.url, "_blank");
        } else {
            alert("Não foi possível gerar PDF.");
        }
    } catch(e) {
        alert("Erro ao solicitar PDF.");
    }
};

/* ================== Inicialização ================== */
loadHistory(""); // carrega tudo ao abrir a página

</script>
</body>
</html>
