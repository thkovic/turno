<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzzfvwV3q7PFycspM95VBVWkEDbM2iPLUxR4rCTE4LALVFXoDAN9-ZvEoZmSDLqElYTig/exec";

const loginForm = document.getElementById("loginForm");
const loginDiv = document.getElementById("loginDiv");
const registroDiv = document.getElementById("registroDiv");
const matricula = document.getElementById("matricula");
const turnoForm = document.getElementById("turnoForm");
const searchInput = document.getElementById("searchInput");
const btnPDF = document.getElementById("btnPDF");
const modalDetalhes = document.getElementById("modalDetalhes");
const modalFields = document.getElementById("modalFields");
const modalButtons = document.getElementById("modalButtons");
const watchdogEl = document.getElementById("watchdog");
const logDiv = document.getElementById("logDiv");
let paginaAtual = 1;
const porPagina = 10;
let historicoFiltrado = [];

let fullHistory = [];
let registroSelecionado = null;
function irPagina(p) {
    paginaAtual = p;
    renderHistory(fullHistory);
}
searchInput.oninput = () => {
    paginaAtual = 1;
    renderHistory(fullHistory);
};


/* JSONP helper */
function callGAS(params) {
    const callback = "cb_" + Math.random().toString(36).slice(2,12);
    const url = GAS_URL + "?" + new URLSearchParams({...params, callback});
    return new Promise((resolve, reject) => {
        window[callback] = (data) => {
            resolve(data);
            try { delete window[callback]; } catch(e){}
        };
        const script = document.createElement("script");
        script.src = url;
        script.onerror = () => {
            reject(new Error("Falha na requisição JSONP"));
            try { delete window[callback]; } catch(e){}
        };
        document.body.appendChild(script);
    });
}

/* LOGIN */
loginForm.onsubmit = async (e) => {
    e.preventDefault();
    const mat = document.getElementById("loginMatricula").value.trim();
    if (!mat) {
        alert("Informe a matrícula.");
        return;
    }
    loginDiv.style.display = "none";
    registroDiv.style.display = "block";
    matricula.value = mat;
    await loadHistory(mat);
    logDiv.style.display = (mat === "991631240") ? "block" : "none";
    try {
        await callGAS({acao:"registrarLog", matricula: mat, acaoTipo:"Login"});
    } catch (err) {
        console.error("Erro ao registrar log de login:", err);
    }
};

/* LOGOUT */
async function fazerLogout() {
    await callGAS({
        acao: "registrarLog",
        matricula: matricula.value,
        acaoTipo: "Logout"
    });

    registroDiv.style.display = "none";
    loginDiv.style.display = "block";
    turnoForm.reset();
    matricula.value = "";

    await loadHistory("");
    logDiv.style.display = "none";
}

document.getElementById("btnLogout").onclick = fazerLogout;

/* FUNÇÕES DE FORMATO */
function formatDate(value){
    if(!value) return "";
    const d = new Date(value);
    return isNaN(d) ? "" : d.toLocaleDateString("pt-BR");
}
function formatTime(value){
    if(!value) return "";
    const d = new Date(value);
    return isNaN(d) ? "" : d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){
    if(s === null || s === undefined) return "";
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;");
}

/* CARREGAR HISTÓRICO */
async function loadHistory(matriculaFiltro="") {
    try {
        const data = await callGAS({acao:"getHistorico", matricula: matriculaFiltro});
        fullHistory = Array.isArray(data) ? data.reverse() : [];
    } catch(err) {
        console.error("Erro ao carregar histórico:", err);
        fullHistory = [];
    }
    renderHistory(fullHistory);
    return fullHistory;
}

function renderHistory(data) {

    const t = document.querySelector("#historyTable tbody");
    const m = document.getElementById("mobileHistory");

    t.innerHTML = "";
    m.innerHTML = "";

    const searchTerm = (searchInput.value || "").toLowerCase();

    // 🔹 1. Garante array
    const lista = Array.isArray(data) ? data : [];

    // 🔹 2. Aplica filtro de busca
    historicoFiltrado = lista.filter(r =>
        r.some((c, idx) => {
            let val = String(c || "").toLowerCase();

            if ([1,5,8].includes(idx)) {
                const d = new Date(c);
                if (!isNaN(d)) {
                    const dataStr = d.toLocaleDateString("pt-BR").toLowerCase();
                    const horaStr = d.toLocaleTimeString("pt-BR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    }).toLowerCase();
                    return dataStr.includes(searchTerm) || horaStr.includes(searchTerm);
                }
            }
            return val.includes(searchTerm);
        })
    );

    if (historicoFiltrado.length === 0) {
        t.innerHTML = '<tr><td colspan="9">Sem registros</td></tr>';
        m.innerHTML = '<p style="text-align:center;color:#888;">Sem registros</p>';
        renderPaginacao();
        return;
    }

    // 🔹 3. Ajusta página atual se necessário
    const totalPaginas = Math.ceil(historicoFiltrado.length / porPagina);
    if (paginaAtual > totalPaginas) paginaAtual = 1;

    // 🔹 4. Paginação
    const inicio = (paginaAtual - 1) * porPagina;
    const fim = inicio + porPagina;
    const pagina = historicoFiltrado.slice(inicio, fim);

    pagina.forEach(r => {

        const tr = document.createElement("tr");
        tr.dataset.id = String(r[0]);
        tr.addEventListener("click", () => abrirModal(r));
        tr.innerHTML = `
          <td>${escapeHtml(r[0])}</td>
          <td>${formatDate(r[1])}</td>
          <td>${escapeHtml(r[2])}</td>
          <td>${escapeHtml(r[3])}</td>
          <td>${escapeHtml(r[4])}</td>
          <td>${formatTime(r[5])}</td>
          <td>${escapeHtml(r[6])}</td>
          <td>${escapeHtml(r[7])}</td>
          <td>${formatTime(r[8])}</td>
        `;
        t.appendChild(tr);

        const card = document.createElement("div");
        card.className = "history-card";
        card.dataset.id = String(r[0]);
        card.addEventListener("click", () => abrirModal(r));
        card.innerHTML = `
          <p><strong>ID:</strong> ${r[0]}</p>
          <p><strong>Data:</strong> ${formatDate(r[1])}</p>
          <p><strong>Executante:</strong> ${escapeHtml(r[2])}</p>
          <p><strong>Equipamento:</strong> ${escapeHtml(r[4])}</p>
        `;
        m.appendChild(card);
    });

  renderPaginacao();
  atualizarRanking();
}
/* MODAL */
function abrirModal(r){
    registroSelecionado = r;
    document.getElementById("modalTitle").textContent = `Ficha Técnica - ID ${r[0]}`;

    modalFields.innerHTML = `
      <div class="tech-field"><strong>ID:</strong> ${escapeHtml(r[0])}</div>
      <div class="tech-field"><strong>Data:</strong> ${formatDate(r[1])}</div>
      <div class="tech-field"><strong>Executante:</strong> ${escapeHtml(r[2])}</div>
      <div class="tech-field"><strong>Matrícula:</strong> ${escapeHtml(r[3])}</div>
      <div class="tech-field"><strong>Equipamento:</strong> ${escapeHtml(r[4])}</div>
      <div class="tech-field"><strong>Acionamento:</strong> ${formatTime(r[5])}</div>
      <div class="tech-field"><strong>Problema:</strong><div>${escapeHtml(r[6])}</div></div>
      <div class="tech-field"><strong>Solução:</strong><div>${escapeHtml(r[7])}</div></div>
      <div class="tech-field"><strong>Encerramento:</strong> ${formatTime(r[8])}</div>
    `;

    modalButtons.innerHTML = "";
    const btnFechar = document.createElement("button");
    btnFechar.textContent = "Fechar";
    btnFechar.style.background = "#2d6a4f";
    btnFechar.addEventListener("click", fecharModal);
    modalButtons.appendChild(btnFechar);

    // ✅ Correção: converter para string antes de trim()
    if (String(matricula.value || "").trim() === String(r[3] || "").trim()) {
        const btnEditar = document.createElement("button");
        btnEditar.textContent = "Editar";
        btnEditar.style.background = "#4dabf7";
        btnEditar.addEventListener("click", () => enterModalEditMode(r));
        modalButtons.appendChild(btnEditar);

        const btnDeletar = document.createElement("button");
        btnDeletar.textContent = "Deletar";
        btnDeletar.style.background = "#ff6b6b";
        btnDeletar.addEventListener("click", () => confirmAndDelete());
        modalButtons.appendChild(btnDeletar);
    }

    modalDetalhes.style.display = "flex";
}

function fecharModal(){
    modalDetalhes.style.display = "none";
    registroSelecionado = null;
}

/* EDIÇÃO */
function enterModalEditMode(r){
    modalFields.innerHTML = `
      <div class="tech-field"><label>Executante:</label>
        <input id="editExecutante" value="${escapeHtml(r[2])}">
      </div>
      <div class="tech-field"><label>Data:</label>
        <input type="date" id="editData" value="${new Date(r[1]).toISOString().split('T')[0]}">
      </div>
      <div class="tech-field"><label>Equipamento:</label>
        <input id="editEquipamento" value="${escapeHtml(r[4])}">
      </div>
      <div class="tech-field"><label>Acionamento:</label>
        <input type="time" id="editAcionamento" value="${r[5] ? new Date(r[5]).toISOString().substring(11,16) : ''}">
      </div>
      <div class="tech-field"><label>Problema:</label>
        <textarea id="editProblema">${escapeHtml(r[6])}</textarea>
      </div>
      <div class="tech-field"><label>Solução:</label>
        <textarea id="editSolucao">${escapeHtml(r[7])}</textarea>
      </div>
      <div class="tech-field"><label>Encerramento:</label>
        <input type="time" id="editEncerramento" value="${r[8] ? new Date(r[8]).toISOString().substring(11,16) : ''}">
      </div>
    `;

    modalButtons.innerHTML = "";
    const btnSalvar = document.createElement("button");
    btnSalvar.textContent = "Salvar";
    btnSalvar.style.background = "#2d6a4f";
    btnSalvar.addEventListener("click", async () => {
        try {
            const payload = {
                acao: "editarTurno",
                id: String(r[0]),
                matricula: matricula.value,
                executante: document.getElementById("editExecutante").value, // ✅ novo campo
                data: document.getElementById("editData").value,
                equipamento: document.getElementById("editEquipamento").value,
                acionamento: document.getElementById("editAcionamento").value,
                problema: document.getElementById("editProblema").value,
                solucao: document.getElementById("editSolucao").value,
                encerramento: document.getElementById("editEncerramento").value
            };
            const res = await callGAS(payload);
            if(res && res.success){
                alert("Registro atualizado!");
                await loadHistory(matricula.value);
                fecharModal();
            } else {
                alert("Erro ao atualizar: " + (res && res.message ? res.message : "desconhecido"));
            }
        } catch(e) {
            alert("Falha na requisição de edição.");
        }
    });
    modalButtons.appendChild(btnSalvar);

    const btnCancelar = document.createElement("button");
    btnCancelar.textContent = "Cancelar";
    btnCancelar.style.background = "#ff6b6b";
    btnCancelar.addEventListener("click", fecharModal);
    modalButtons.appendChild(btnCancelar);
}

/* DELETAR */
async function confirmAndDelete(){
    if(!registroSelecionado) return;
    if(!confirm(`Deseja realmente deletar o registro ID ${registroSelecionado[0]}?`)) return;
    try {
        const res = await callGAS({acao:"deletarTurno", id: String(registroSelecionado[0]), matricula: String(matricula.value || "")});
        if(res && res.success){
            alert("Registro deletado.");
            await loadHistory(matricula.value);
            fecharModal();
        } else {
            alert("Erro ao deletar: " + (res && res.message ? res.message : "desconhecido"));
        }
    } catch(e) {
        alert("Falha na requisição de deleção.");
    }
}

/* REGISTRAR */
turnoForm.onsubmit = async e => {
    e.preventDefault();

    const payload = {
        acao: "registrarTurno",
        nome: document.getElementById("nome").value.trim(),
        matricula: document.getElementById("matricula").value.trim(),
        data: document.getElementById("data").value || "",
        equipamento: document.getElementById("equipamento").value.trim(),
        acionamento: document.getElementById("acionamento").value || "",
        problema: document.getElementById("problema").value.trim(),
        solucao: document.getElementById("solucao").value.trim(),
        encerramento: document.getElementById("encerramento").value || ""
    };

    try {
        const res = await callGAS(payload);

        if (res && res.success) {
            alert("Registro salvo! Faça login novamente.");

            turnoForm.reset();

            // 🔐 força logout após salvar
            await fazerLogout();
        } else {
            alert("Erro ao salvar: " + (res && res.message ? res.message : "desconhecido"));
        }

    } catch (e) {
        alert("Falha na requisição de registro.");
    }
};

/* WATCHDOG */
async function atualizarWatchdog(){
    try{
        const r = await callGAS({acao:"getWatchdog"});
        watchdogEl.innerText = "Watchdog: " + (r && r.watchdog !== undefined ? r.watchdog : "OFFLINE");
    } catch(e) {
        watchdogEl.innerText = "Watchdog: OFFLINE";
    }
}
setInterval(atualizarWatchdog, 3000);
atualizarWatchdog();

btnPDF.onclick = async () => {
    try {
        const r = await callGAS({ acao: "gerarExcel" });

        if (r && r.url) {
            window.open(r.url, "_blank");
        } else {
            alert("Não foi possível gerar o Excel.");
            console.error("Resposta GAS:", r);
        }

    } catch (e) {
        console.error(e);

};

/* ================= PAGINAÇÃO ================= */
function renderPaginacao(){
  var totalPaginas = Math.ceil(historicoFiltrado.length / porPagina);
  if (totalPaginas <= 1) return;

  var pag = document.getElementById("paginacao");
  if (!pag) {
    pag = document.createElement("div");
    pag.id = "paginacao";
    pag.className = "paginacao";
    document.querySelector(".history").appendChild(pag);
  }

  var html = '<button '+(paginaAtual===1?'disabled':'')+
             ' onclick="irPagina('+(paginaAtual-1)+')">«</button>';

  for (var i=1;i<=totalPaginas;i++){
    html += '<button class="'+(paginaAtual===i?'ativo':'')+
            '" onclick="irPagina('+i+')">'+i+'</button>';
  }

  html += '<button '+(paginaAtual===totalPaginas?'disabled':'')+
          ' onclick="irPagina('+(paginaAtual+1)+')">»</button>';

  pag.innerHTML = html;
}

function irPagina(p){
  paginaAtual = p;

}
 // ================= TOGGLE DO RANKING =================
const btnRankingToggle = document.getElementById("btnRankingToggle");
const rankingBox = document.getElementById("rankingEquipamentos");
const btnRankingClose = document.getElementById("btnRankingClose");

// Abrir/fechar com o botão principal
btnRankingToggle.addEventListener("click", function () {
  const aberto = rankingBox.classList.toggle("aberto");
  btnRankingToggle.textContent = aberto ? "Esconder Ranking" : "Mostrar Ranking";
});

// Botão X para fechar imediatamente
btnRankingClose.addEventListener("click", function () {
  rankingBox.classList.remove("aberto");
  btnRankingToggle.textContent = "Mostrar Ranking";
});

/* ================= RANKING ================= */
function atualizarRanking(){
  var contagem = {};
  var total = historicoFiltrado.length;
  var container = document.getElementById("rankingLista");

  if (!container) return;
  container.innerHTML = "";

  if (total === 0) return;

  // Conta ocorrências
  for (var i = 0; i < historicoFiltrado.length; i++) {
    var eq = historicoFiltrado[i][4];
    if (!eq) continue;
    contagem[eq] = (contagem[eq] || 0) + 1;
  }

  // Ordena
  var itens = Object.keys(contagem).sort(function(a, b) {
    return contagem[b] - contagem[a];
  });

  // Top 10
  for (var j = 0; j < itens.length && j < 10; j++) {
    var nome = itens[j];
    var qtd = contagem[nome];
    var pct = ((qtd / total) * 100).toFixed(1);

    var item = document.createElement("div");
    item.className = "ranking-item";

    item.innerHTML =
      '<div class="ranking-header">' +
        '<span><span class="ranking-pos">' + (j+1) + 'º</span>' +
        escapeHtml(nome) + '</span>' +
        '<span>' + pct + '%</span>' +
      '</div>' +

      '<div class="barra" style="width:' + pct + '%"></div>' +

      '<div class="barra-info">' +
        '<span>' + qtd + ' ocorrência(s)</span>' +
        '<span>' + pct + '%</span>' +
      '</div>';

    container.appendChild(item);
  }
}
